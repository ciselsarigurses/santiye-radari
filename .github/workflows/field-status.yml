name: Saha Durumunu İşle

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  apply-status:
    if: >-
      (startsWith(github.event.issue.title, '[SAHA] ') ||
      startsWith(github.event.issue.title, '[KALIBRASYON] ')) &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Saha veya kalibrasyon sonucunu uygula
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python apply_field_status.py "$ISSUE_TITLE"
          # normalize_daily_report açık ama o gün tekrar görünmeyen uydu
          # görevlerini 0 m² metadatasız bırakabilir. Son güvenilir ölçüyü geri
          # yükleyip telefon kısa listesini aynı işlem içinde yeniden kur.
          python hydrate_persisted_satellite_metadata.py
          python daily_route_shortlist.py
          python daily_route_freshness_guard.py

      - name: Durumu kalıcı kaydet
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # Saha işlemi sürerken main değişmişse binary SQLite dosyasını rebase ile
          # birleştirmeye çalışma. En güncel main'i alıp aynı kullanıcı kararını
          # bir kez yeniden uygula; böylece saha kararı kaybolmaz ve DB çakışmaz.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal saha işlemi sırasında değişti; karar en güncel veri üzerinde yeniden uygulanıyor."
            git reset --hard origin/main
            python apply_field_status.py "$ISSUE_TITLE"
            python hydrate_persisted_satellite_metadata.py
            python daily_route_shortlist.py
            python daily_route_freshness_guard.py
          fi

          git add santiye.db SAHA_RAPORU.md latest_report.json
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni durum farkı yok."
          else
            git commit -m "Saha: $ISSUE_TITLE"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Ana dal yeniden değişti; veri kaybı riskine girmeden durum talebi açık bırakılıyor."
              exit 1
            fi
            git push origin HEAD:main
          fi

      - name: Talebi kapat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Durum Şantiye Radarı'na kaydedildi."
