name: Ön Sezon Taze Kanıt Rota Düzeltmesi

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preseason-fresh-evidence-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Taze kanıt penceresini güvenli biçimde düzelt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("daily_route_freshness_guard.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "TEKRAR_GIT dediği kayıt veya yeni Sentinel görüntüsünde ortaya çıkan güçlü kompakt\nerken/parsel sinyali girebilir. Kuru-zemin diagnostik kalibrasyon noktaları bu dönemde\n",
                  "TEKRAR_GIT dediği kayıt veya en fazla iki günlük güncel Sentinel kanıtı taşıyan güçlü\nkompakt erken/parsel sinyali girebilir. Kuru-zemin diagnostik kalibrasyon noktaları bu dönemde\n",
              ),
              (
                  'PRESEASON_SMALL_MAX_M2 = 800\nPRESEASON_ALLOWED_SATELLITE_PRIORITIES = {"YÜKSEK", "ORTA"}\n',
                  'PRESEASON_SMALL_MAX_M2 = 800\nPRESEASON_MAX_EVIDENCE_AGE_DAYS = 2\nPRESEASON_ALLOWED_SATELLITE_PRIORITIES = {"YÜKSEK", "ORTA"}\n',
              ),
              (
                  '    "çıkarılmaz. Yalnız insanın TEKRAR_GIT dediği kayıt veya yeni Sentinel görüntüsünde "\n    "beliren güçlü kompakt ERKEN/PARSEL-küçük saha sinyali gösterilir; diğer kayıtlar "\n',
                  '    "çıkarılmaz. Yalnız insanın TEKRAR_GIT dediği kayıt veya en fazla 2 günlük güncel "\n    "Sentinel kanıtı taşıyan güçlü kompakt ERKEN/PARSEL-küçük saha sinyali gösterilir; diğer kayıtlar "\n',
              ),
              (
                  'def _fresh_preseason_candidate(item):\n    """Yasak döneminde ancak yeni ve güçlü kanıtı veya insan talebi olan adayı geçir."""\n',
                  'def _fresh_preseason_evidence(item):\n    """Yeni sahne veya açıkça ölçülmüş en fazla iki günlük güncel Sentinel kanıtı."""\n    if not isinstance(item, dict):\n        return False\n    if item.get("yeni_goruntu") is True:\n        return True\n    raw_age = item.get("uydu_kanit_yasi_gun")\n    try:\n        age_days = float(raw_age)\n    except (TypeError, ValueError):\n        return False\n    return 0 <= age_days <= PRESEASON_MAX_EVIDENCE_AGE_DAYS\n\n\ndef _fresh_preseason_candidate(item):\n    """Yasak döneminde ancak güncel-güçlü kanıtı veya insan talebi olan adayı geçir."""\n',
              ),
              (
                  '    # Aynı eski Sentinel ölçüsünün günlerce taşınması saha rotası nedeni değildir.\n    if item.get("yeni_goruntu") is not True:\n        return False\n    if _historical_evidence_rank(item) != 0:\n        return False\n',
                  '    # Aynı eski Sentinel ölçüsünün günlerce taşınması saha rotası nedeni değildir.\n    # Fakat ilk görüntü gününden sonra raporun `yeni_goruntu` bayrağı kapanınca, henüz\n    # doğrulanmamış 1-2 günlük güçlü ERKEN sinyal de rotadan düşmemelidir.\n    if _historical_evidence_rank(item) != 0:\n        return False\n    if not _fresh_preseason_evidence(item):\n        return False\n',
              ),
              (
                  '    assert preseason_ids == ["MANUAL_REPEAT", "FRESH_EARLY"], preseason_ids\n    assert "HIST_SMALL" not in preseason_ids\n    assert "CURRENT_SMALL" not in preseason_ids\n',
                  '    assert preseason_ids == ["MANUAL_REPEAT", "FRESH_EARLY"], preseason_ids\n    assert "HIST_SMALL" not in preseason_ids\n    assert "CURRENT_SMALL" not in preseason_ids\n\n    # Yeni görüntü bayrağı ertesi gün kapanır; açık ve doğrulanmamış güçlü kanıt\n    # en fazla iki günlük pencere boyunca ilk saha rotasında kalmalıdır.\n    carryover_early = dict(fresh_early)\n    carryover_early.update(\n        {\n            "gorev_id": "CARRYOVER_EARLY",\n            "yeni_goruntu": False,\n            "uydu_kanit_yasi_gun": 1,\n        }\n    )\n    stale_early = dict(carryover_early)\n    stale_early.update(\n        {\n            "gorev_id": "STALE_EARLY",\n            "uydu_kanit_yasi_gun": PRESEASON_MAX_EVIDENCE_AGE_DAYS + 1,\n        }\n    )\n    historical_carryover = dict(carryover_early)\n    historical_carryover.update(\n        {\n            "gorev_id": "HIST_CARRYOVER",\n            "tarihsel_esleme_mesafe_m": 4.0,\n        }\n    )\n    retained = select_fresh_shortlist(\n        [carryover_early, stale_early, historical_carryover],\n        limit=3,\n        local_day=date(2026, 9, 9),\n    )\n    retained_ids = [item["gorev_id"] for item in retained]\n    assert retained_ids == ["CARRYOVER_EARLY"], retained_ids\n    assert _fresh_preseason_evidence(carryover_early) is True\n    assert _fresh_preseason_evidence(stale_early) is False\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Beklenen patch bloğu tekil değil: count={count}, başlangıç={old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Regresyon testleri ve güncel rapora uygula
        run: |
          python daily_route_freshness_guard.py
          python preseason_route_final_guard.py --check-only
          python preseason_route_final_guard.py

      - name: Sonucu doğrula
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("latest_report.json").read_text(encoding="utf-8"))
          first = report.get("gunun_ilk_3_kontrolu") or []
          match = [
              item for item in first
              if abs(float(item.get("enlem", 0)) - 38.331547) < 1e-6
              and abs(float(item.get("boylam", 0)) - 26.644338) < 1e-6
          ]
          if not match:
              raise SystemExit("1 günlük Gülbahçe ERKEN adayı ilk rota penceresinde korunmadı.")
          item = match[0]
          if float(item.get("uydu_kanit_yasi_gun", 99)) > 2:
              raise SystemExit("Taze kanıt yaşı beklenen pencerenin dışında.")
          print("Taze ERKEN rota retention doğrulandı:", item.get("gorev_id"), item.get("uydu_kanit_yasi_gun"))
          PY

      - name: Küçük ve geri alınabilir değişikliği kaydet
        shell: bash
        run: |
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git rm .github/workflows/preseason-fresh-evidence-migration.yml
          git add daily_route_freshness_guard.py latest_report.json SAHA_RAPORU.md
          git commit -m "Radar: 2 günlük taze ERKEN kanıtı ön sezon rotasında koru"
          git push origin HEAD:main
