name: Uygulama Veri Sonrası Açılış Testi

on:
  # Günlük tarama kendi GITHUB_TOKEN'i ile rapor/veri commit'i attığında GitHub
  # güvenlik gereği yeni bir push workflow'u zincirlemez. Bu yüzden asıl veri-sonrası
  # doğrulama, Günlük Şantiye Taraması tamamlandığında workflow_run ile tetiklenir.
  workflow_run:
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
  # Uygulama kodu veya bu kontrolün kendisi elle değiştiğinde de hemen test et.
  push:
    branches: [main]
    paths:
      - "app.py"
      - "pages/**"
      - "calibration_outcome.py"
      - "field_outcome.py"
      - "apply_field_status.py"
      - ".github/workflows/app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santiye-radari-app-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Başarısız bir günlük taramanın çıktısını 'sağlıklı' diye onaylamayalım.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          # workflow_run olayı tamamlanan koşunun eski head SHA'sına işaret eder;
          # tarama sonunda botun yazdığı güncel veri commit'ini test etmek için main'i al.
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Saha geri bildirim şema öz testi
        run: |
          python field_outcome.py --check-only
          python -m py_compile apply_field_status.py

      - name: Güncel veri ile uygulama açılış testi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          report = json.loads(Path("latest_report.json").read_text(encoding="utf-8"))
          assert isinstance(report.get("saha_adaylari"), list), "latest_report saha_adaylari listesi eksik"

          app = AppTest.from_file("app.py")
          app.run(timeout=45)
          assert not app.exception, app.exception

          field_page = AppTest.from_file("pages/1_Saha_Kontrol.py")
          field_page.run(timeout=45)
          assert not field_page.exception, field_page.exception

          calibration_page = AppTest.from_file("pages/2_Kalibrasyon.py")
          calibration_page.run(timeout=45)
          assert not calibration_page.exception, calibration_page.exception
          PY
