name: Uygulama Veri Sonrası Açılış Testi

on:
  # Günlük tarama kendi GITHUB_TOKEN'i ile rapor/veri commit'i attığında GitHub
  # güvenlik gereği yeni bir push workflow'u zincirlemez. MİKRO footprint zinciri de
  # koordinat/izleme JSON'larını kendi token'iyle yazar. Bu yüzden veri-sonrası
  # doğrulama iki üretim workflow'u tamamlandığında workflow_run ile tetiklenir.
  workflow_run:
    workflows: ["Günlük Şantiye Taraması", "Mikro Temporal Bileşen İzi Denetimi"]
    types: [completed]
  # Uygulama kodu veya bu kontrolün kendisi elle değiştiğinde de hemen test et.
  push:
    branches: [main]
    paths:
      - "app.py"
      - "pages/**"
      - "coordinate_navigation.py"
      - "portal_route_policy.py"
      - "calibration_outcome.py"
      - "field_outcome.py"
      - "field_feedback_audit.py"
      - "apply_field_status.py"
      - "micro_site_footprint_priority_review.json"
      - ".github/workflows/app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: santiye-radari-app-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Başarısız bir veri üretim koşusunun çıktısını 'sağlıklı' diye onaylamayalım.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          # workflow_run olayı tamamlanan koşunun eski head SHA'sına işaret eder;
          # üretim sonunda botun yazdığı güncel veri commit'ini test etmek için main'i al.
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Saha geri bildirim şema ve kalibrasyon kilidi öz testi
        run: |
          python field_outcome.py --check-only
          python field_feedback_audit.py --check-only
          python coordinate_navigation.py --check-only
          python portal_route_policy.py
          python -m py_compile apply_field_status.py

      - name: Güncel veri ile uygulama açılış testi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          report = json.loads(Path("latest_report.json").read_text(encoding="utf-8"))
          assert isinstance(report.get("saha_adaylari"), list), "latest_report saha_adaylari listesi eksik"
          assert isinstance(report.get("gunun_ilk_3_kontrolu"), list), "Merkezi günlük saha rotası eksik"

          micro = json.loads(Path("micro_site_footprint_priority_review.json").read_text(encoding="utf-8"))
          assert micro.get("ana_uretim_esigi_m2") == 250, "Mikro katman ana 250 m² eşiğini değiştiremez"
          assert micro.get("mikro_aralik_m2") == [150, 249], "Mikro diagnostik bandı 150-249 m² olmalı"
          assert micro.get("alarm") is False and micro.get("saha_gorevi") is False, "Mikro katman alarm/görev üretmemeli"

          micro_coord = json.loads(Path("micro_site_coordinate_audit.json").read_text(encoding="utf-8"))
          assert micro_coord.get("ana_uretim_esigi_m2") == 250, "Mikro koordinat katmanı 250 m² ana eşiği korumalı"
          assert micro_coord.get("mikro_aralik_m2") == [150, 249], "Mikro koordinat diagnostik bandı 150-249 m² olmalı"
          assert micro_coord.get("alarm") is False and micro_coord.get("saha_gorevi") is False, "Mikro koordinat katmanı alarm/görev üretmemeli"
          assert isinstance(micro_coord.get("adaylar"), list), "Mikro koordinat aday listesi eksik"

          app = AppTest.from_file("app.py")
          app.run(timeout=45)
          assert not app.exception, app.exception

          portal_page = AppTest.from_file("pages/0_Bugun_Gidilecekler.py")
          portal_page.run(timeout=45)
          assert not portal_page.exception, portal_page.exception

          field_page = AppTest.from_file("pages/1_Saha_Kontrol.py")
          field_page.run(timeout=45)
          assert not field_page.exception, field_page.exception

          calibration_page = AppTest.from_file("pages/2_Kalibrasyon.py")
          calibration_page.run(timeout=45)
          assert not calibration_page.exception, calibration_page.exception

          micro_page = AppTest.from_file("pages/3_Mikro_Santiye.py")
          micro_page.run(timeout=45)
          assert not micro_page.exception, micro_page.exception

          early_ground_page = AppTest.from_file("pages/4_Erken_Zemin_Sinyalleri.py")
          early_ground_page.run(timeout=45)
          assert not early_ground_page.exception, early_ground_page.exception

          geometry_page = AppTest.from_file("pages/5_Geometri_Ayrisma.py")
          geometry_page.run(timeout=45)
          assert not geometry_page.exception, geometry_page.exception

          current_blind_page = AppTest.from_file("pages/6_Gulbahce_Guncel_Kor_Alanlar.py")
          current_blind_page.run(timeout=45)
          assert not current_blind_page.exception, current_blind_page.exception
          PY
