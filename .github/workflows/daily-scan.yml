name: Günlük Şantiye Taraması

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "pages/**"
      - "scanner.py"
      - "source_label_quality.py"
      - "satellite.py"
      - "satellite_quality.py"
      - "candidate_capacity_audit.py"
      - "shape_false_positive_audit.py"
      - "rebalance_satellite_candidates.py"
      - "post_dedupe_construction_quota.py"
      - "post_dedupe_construction_quota_runner.py"
      - "reconcile_selection_tasks.py"
      - "temporal_gap_scan.py"
      - "temporal_quality.py"
      - "latest_cloud_gap_scan.py"
      - "latest_cloud_quality.py"
      - "cloud_threshold_audit.py"
      - "spatial_quality.py"
      - "daily_report.py"
      - "report_quality.py"
      - "field_state.py"
      - "field_state_quality.py"
      - "field_outcome.py"
      - "apply_field_status.py"
      - "refresh_satellite_analysis.py"
      - "reactivate_current_satellite.py"
      - "retain_recent_candidates.py"
      - "carry_forward_satellite_candidates.py"
      - "dedupe_overlap_satellite.py"
      - "hydrate_persisted_satellite_metadata.py"
      - "requirements.txt"
      - ".github/workflows/daily-scan.yml"
      - ".github/workflows/field-status.yml"
  schedule:
    # Türkiye saatiyle 11:00 ana tarama korunur. Sentinel görüntüsü sabah
    # taramasından sonra yayımlanırsa ertesi güne kalmaması için 15:00 ve 19:00'da
    # da aynı ücretsiz kaynaklar yeniden kontrol edilir (UTC+3: 08,12,16 UTC).
    - cron: "0 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Uydu kapsama ve 250 m² kalite kontrolü
        run: python satellite_quality.py

      - name: Aday kapasite körlüğü kalite kontrolü
        run: python candidate_capacity_audit.py --check-only

      - name: Geniş aday şekil yanlış-pozitif kalite kontrolü
        run: python shape_false_positive_audit.py --check-only

      - name: Zaman serisi bulut-gölge kalite kontrolü
        run: python temporal_quality.py

      - name: En yeni görüntü bulut-körlük kalite kontrolü
        run: python latest_cloud_quality.py

      - name: Sentinel global bulut eşiği körlük denetimi
        run: python cloud_threshold_audit.py

      - name: Saha görev ayrıştırma kalite kontrolü
        run: python field_state_quality.py

      - name: Uygulama açılış testi
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py")
          app.run(timeout=45)
          assert not app.exception, app.exception

          field_page = AppTest.from_file("pages/1_Saha_Kontrol.py")
          field_page.run(timeout=45)
          assert not field_page.exception, field_page.exception
          PY

      - name: İnternet taramasını çalıştır
        run: python scanner.py

      - name: İnternet kaynak etiketi kalite kontrolü
        run: python source_label_quality.py

      - name: Taze internet adaylarını kısa süre koru
        run: python retain_recent_candidates.py

      - name: Uydu analiz sürümünü kontrol et
        run: python refresh_satellite_analysis.py

      - name: Günlük uydu ve radar raporunu oluştur
        run: python daily_report.py

      - name: Şantiye ölçeği adaylarını toplam tavan içinde dengele
        run: python rebalance_satellite_candidates.py

      - name: Eski görüntü bulut-gölge boşluklarını zaman serisiyle tamamla
        run: python temporal_gap_scan.py

      - name: En yeni görüntü bulut-gölge körlüğünü son açık sahneyle tamamla
        run: python latest_cloud_gap_scan.py

      - name: Yeni görüntü yokken bekleyen uydu aday ayrıntılarını koru
        run: python carry_forward_satellite_candidates.py

      - name: Çakışan uydu kutularında mükerrer adayı ele
        run: python dedupe_overlap_satellite.py

      - name: Çakışma sonrası şantiye ölçeği kotasını alarm artırmadan koru
        run: python post_dedupe_construction_quota_runner.py

      - name: Uydu aday tavanı körlüğünü ölç
        run: python candidate_capacity_audit.py

      - name: Geniş aday şekil yanlış-pozitif riskini ölç
        run: python shape_false_positive_audit.py

      - name: Mekânsal saha kalite kontrolü
        run: python spatial_quality.py

      - name: Yeniden görünen otomatik-elendi uydu görevlerini geri aç
        run: python reactivate_current_satellite.py

      - name: Günlük rapor kalite kontrolü
        run: python report_quality.py

      - name: Aynı gün seçim dışı kalan dokunulmamış görevleri pasifleştir
        run: python reconcile_selection_tasks.py

      - name: Açık uydu görevlerinin son güvenilir ölçüsünü koru
        run: python hydrate_persisted_satellite_metadata.py

      - name: Tarama ve rapor sonuçlarını kaydet
        run: |
          report_files="santiye.db SAHA_RAPORU.md latest_report.json candidate_capacity_audit.json shape_false_positive_audit.json"
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Yeni veya güncellenen bulgu/rapor yok."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add $report_files
          git commit -m "Radar: günlük tarama ve saha raporunu güncelle"

          # Tarama sürerken main değişmişse SQLite/veri dosyalarını rebase ile
          # birleştirmeye çalışma. En güncel main'i alıp taramayı bir kez yeniden
          # üret; böylece ikili DB çakışması ve eski verinin üzerine yazılması önlenir.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal tarama sırasında değişti; en güncel veri üzerinde bir kez yeniden üretiliyor."
            git reset --hard origin/main
            pip install -r requirements.txt
            python satellite_quality.py
            python candidate_capacity_audit.py --check-only
            python shape_false_positive_audit.py --check-only
            python temporal_quality.py
            python latest_cloud_quality.py
            python cloud_threshold_audit.py
            python field_state_quality.py
            python scanner.py
            python source_label_quality.py
            python retain_recent_candidates.py
            python refresh_satellite_analysis.py
            python daily_report.py
            python rebalance_satellite_candidates.py
            python temporal_gap_scan.py
            python latest_cloud_gap_scan.py
            python carry_forward_satellite_candidates.py
            python dedupe_overlap_satellite.py
            python post_dedupe_construction_quota_runner.py
            python candidate_capacity_audit.py
            python shape_false_positive_audit.py
            python spatial_quality.py
            python reactivate_current_satellite.py
            python report_quality.py
            python reconcile_selection_tasks.py
            python hydrate_persisted_satellite_metadata.py

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "Yeniden üretim sonrası kaydedilecek veri değişikliği yok."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: günlük tarama ve saha raporunu güncelle"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Ana dal yeniden değişti; veri kaybı riskine girmeden sonraki çalışmaya bırakıldı."
              exit 1
            fi
          fi

          # GitHub zaman zaman sunucu tarafında `fatal error in commit_refs` ile
          # geçici bir ref güncelleme hatası döndürebiliyor. Aynı commit'i en fazla
          # üç kez yeniden dene; fakat her denemeden önce main'in ilerlemediğini
          # doğrula. Böylece geçici GitHub hatası raporu kaybettirmez, eşzamanlı
          # başka bir commit varsa da eski SQLite verisiyle dalın üzerine yazılmaz.
          push_ok=0
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Push öncesinde main değişti; veri kaybı riskine girmeden sonraki çalışmaya bırakıldı."
              exit 1
            fi
            if git push origin HEAD:main; then
              push_ok=1
              break
            fi
            echo "GitHub push denemesi ${attempt}/3 başarısız; geçici hata için yeniden deneniyor."
            sleep $((attempt * 2))
          done

          if [[ "$push_ok" -ne 1 ]]; then
            echo "Üç güvenli push denemesi de başarısız oldu; veri yerelde kaldı ve sonraki çalışmada yeniden üretilecek."
            exit 1
          fi