name: Günlük Şantiye Taraması

on:
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "requirements.txt"
      - ".github/workflows/daily-scan.yml"
  schedule:
    # Türkiye saatiyle her sabah yaklaşık 07:15 (yaz saati sabittir, UTC+3)
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Uygulama açılış testi
        if: github.event_name == 'push'
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              kill "$APP_PID"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          kill "$APP_PID" || true
          exit 1

      - name: İnternet taramasını çalıştır
        run: python scanner.py

      - name: Yeni bulguları kaydet
        run: |
          if git diff --quiet -- santiye.db; then
            echo "Yeni veya güncellenen bulgu yok."
            exit 0
          fi
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add santiye.db
          git commit -m "Radar: günlük tarama sonuçlarını güncelle"
          git push
