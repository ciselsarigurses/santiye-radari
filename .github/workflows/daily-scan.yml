name: Günlük Şantiye Taraması

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "scanner.py"
      - "satellite.py"
      - "requirements.txt"
      - ".github/workflows/daily-scan.yml"
  schedule:
    # Türkiye saatiyle her sabah yaklaşık 07:15 (yaz saati sabittir, UTC+3)
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Uygulama açılış testi
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app.py")
          app.run(timeout=45)
          assert not app.exception, app.exception
          PY

      - name: İnternet taramasını çalıştır
        run: python scanner.py

      - name: Yeni bulguları kaydet
        run: |
          if git diff --quiet -- santiye.db; then
            echo "Yeni veya güncellenen bulgu yok."
            exit 0
          fi
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add santiye.db
          git commit -m "Radar: günlük tarama sonuçlarını güncelle"
          git push
