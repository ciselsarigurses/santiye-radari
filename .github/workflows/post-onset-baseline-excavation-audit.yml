name: 13 Eylül Baseline Kazı Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "post_onset_baseline_excavation_audit.py"
      - ".github/workflows/post-onset-baseline-excavation-audit.yml"
  workflow_run:
    workflows:
      - "Sentinel Yeni Sahne Hızlı Yoklama"
      - "15-17 Eylül Sahne Pencere Diagnostiği"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-post-onset-baseline-excavation
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Baseline diagnostik öz testi
        run: python post_onset_baseline_excavation_audit.py --check-only

      - name: 13 Eylül baseline ile güncel post-onset sahneyi ölç
        run: python post_onset_baseline_excavation_audit.py

      - name: Yalnız semantik değişiklik varsa güvenli kaydet
        run: |
          output="post_onset_baseline_excavation_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "Baseline kazı diagnostiği değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python post_onset_baseline_excavation_audit.py --check-only
            python post_onset_baseline_excavation_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: 13 Eylül baseline kazı diagnostiğini güncelle"
            if git push origin HEAD:main; then
              echo "Baseline kazı diagnostiği kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Baseline kazı diagnostiği üç denemede kaydedilemedi."
          exit 1
