name: Mikro Temporal Bileşen İzi Denetimi

on:
  push:
    branches: [main]
    paths:
      - "micro_site_temporal_footprint_audit.py"
      - "micro_site_footprint_priority_review.py"
      - "micro_site_watchlist.py"
      - "micro_site_audit.py"
      - "micro_site_shortlist.json"
      - "micro_site_temporal_review.json"
      - "micro_site_locality_review.json"
      - "micro_site_field_review.json"
      - ".github/workflows/micro-site-footprint-audit.yml"
  schedule:
    # Mikro zaman-serisi sentezinden sonra yalnız diagnostik karşılaştırma.
    - cron: "55 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-micro-footprint-audit
  cancel-in-progress: false

jobs:
  footprint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Ana uydu kalite korumalarını doğrula
        run: python satellite_quality.py

      - name: Bileşen-izi audit öz testini çalıştır
        run: python micro_site_temporal_footprint_audit.py --check-only

      - name: 3x3 temporal örneklemeyi gerçek mikro bileşen iziyle karşılaştır
        run: python micro_site_temporal_footprint_audit.py

      - name: Footprint mikro öncelik öz testini çalıştır
        run: python micro_site_footprint_priority_review.py --check-only

      - name: Bileşen temporal ve lokal kanıtını güvenli diagnostik öncelikte birleştir
        run: python micro_site_footprint_priority_review.py

      - name: Güçlü mikro aday izleme öz testini çalıştır
        run: python micro_site_watchlist.py --check-only

      - name: Güçlü mikro adayları Sentinel sahneleri arasında koru
        run: python micro_site_watchlist.py

      - name: Sonuçları yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          if git ls-files --error-unmatch micro_site_temporal_footprint_audit.json >/dev/null 2>&1; then
            meaningful="$(git diff -- micro_site_temporal_footprint_audit.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
            if [[ -z "$meaningful" ]]; then
              echo "Bileşen-izi audit çıktısında yalnız çalışma zamanı değişti."
              git checkout -- micro_site_temporal_footprint_audit.json
            fi
          fi

          if [[ -z "$(git status --porcelain -- micro_site_temporal_footprint_audit.json micro_site_footprint_priority_review.json micro_site_watchlist.json)" ]]; then
            echo "Footprint mikro diagnostik ve izleme sonuçları değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add micro_site_temporal_footprint_audit.json micro_site_footprint_priority_review.json micro_site_watchlist.json
          git commit -m "Radar: footprint mikro diagnostik ve izleme sonucunu güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal değişti; eski diagnostik sonuç üzerine yazılmayacak."
            exit 0
          fi
          git push origin HEAD:main