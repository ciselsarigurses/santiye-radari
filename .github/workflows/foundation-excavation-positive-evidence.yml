name: Temel Kazısı Pozitif Kanıt Recall Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "foundation_excavation_positive_evidence_audit.py"
      - "foundation_excavation_route_gate_review.json"
      - "temporal_local_precursor_watchlist.json"
      - "sar_hard_veto_calibration_review.json"
      - ".github/workflows/foundation-excavation-positive-evidence.yml"
  workflow_run:
    workflows:
      - "Temel Kazısı Morfoloji Diagnostiği"
      - "SAR Hard-Veto Kalibrasyon Diagnostiği"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-foundation-positive-evidence
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pozitif-only kanıt öz testi
        run: python foundation_excavation_positive_evidence_audit.py --check-only

      - name: Morfoloji + SAR pozitif veya önceki-tarih temporal kanıtını çaprazla
        run: python foundation_excavation_positive_evidence_audit.py

      - name: Diagnostiği güvenli kaydet
        run: |
          output="foundation_excavation_positive_evidence_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "Pozitif kanıt recall diagnostiği değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python foundation_excavation_positive_evidence_audit.py --check-only
            python foundation_excavation_positive_evidence_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: pozitif kanıt recall diagnostiğini güncelle"
            if git push origin HEAD:main; then
              echo "Pozitif kanıt recall diagnostiği kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden denenecek (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Üç denemede diagnostik kaydı tamamlanamadı."
          exit 1
