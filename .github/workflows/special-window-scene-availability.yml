name: 15-17 Eylül Sahne Pencere Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "special_window_scene_availability_audit.py"
      - ".github/workflows/special-window-scene-availability.yml"
  workflow_run:
    workflows: ["Sentinel Yeni Sahne Hızlı Yoklama"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-special-window-scene-availability
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Exact sahne pencere öz testi
        run: python special_window_scene_availability_audit.py --check-only

      - name: 13-17 Eylül exact veri uygunluğunu ölç
        run: python special_window_scene_availability_audit.py

      - name: Yalnız semantik değişiklik varsa kaydet
        run: |
          output="special_window_scene_availability_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "Exact sahne uygunluğu değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python special_window_scene_availability_audit.py --check-only
            python special_window_scene_availability_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde sahne uygunluğu değişmedi."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: 15-17 Eylül exact sahne uygunluğunu güncelle"
            if git push origin HEAD:main; then
              echo "Exact sahne uygunluğu kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Exact sahne uygunluğu üç denemede kaydedilemedi."
          exit 1
