name: 15-17 Eylül Sahne Pencere Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "special_window_scene_availability_audit.py"
      - ".github/workflows/special-window-scene-availability.yml"
  workflow_run:
    workflows: ["Sentinel Yeni Sahne Hızlı Yoklama"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: santiye-radari-special-window-scene-availability
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Exact sahne pencere öz testi
        run: python special_window_scene_availability_audit.py --check-only

      - name: 13-17 Eylül exact veri uygunluğunu ölç
        id: exact_window
        shell: bash
        run: |
          output="special_window_scene_availability_review.json"
          cp "$output" /tmp/special-window-before.json
          python special_window_scene_availability_audit.py

          python - "$output" /tmp/special-window-before.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          current_path, previous_path, github_output = map(Path, sys.argv[1:4])
          current = json.loads(current_path.read_text(encoding="utf-8"))
          previous = json.loads(previous_path.read_text(encoding="utf-8"))

          REGIONS = ("cesme", "uzunkuyu")

          def requested_pairs(report):
              return tuple(str(pair) for pair in (report.get("istenen_exact_ciftler") or ()))

          def s2_capability(report, region, pair):
              node = (
                  (((report.get("sentinel2") or {}).get(region) or {}).get("exact_ciftler") or {})
                  .get(pair)
                  or {}
              )
              # Sürüm 2'de operasyon odağı kanonik kaynaktır. Eski raporda bu alan
              # yoksa dış morfoloji/BSI alanlarına düşerek yalnız şema geçişinin
              # yeni veri gibi görünmesini engelle.
              operational = node.get("operasyon_odagi")
              source = operational if isinstance(operational, dict) else node
              return any(
                  bool((source.get(kind) or {}).get("exact_cift_var"))
                  for kind in ("morfoloji", "bsi")
              )

          def s1_capability(report, region, pair):
              node = (
                  (((report.get("sentinel1") or {}).get(region) or {}).get("exact_ciftler") or {})
                  .get(pair)
                  or {}
              )
              return bool(node.get("exact_cift_var"))

          def capability_matrix(report, pairs):
              matrix = {}
              for region in REGIONS:
                  for pair in pairs:
                      matrix[("sentinel2", region, pair)] = s2_capability(report, region, pair)
                      matrix[("sentinel1", region, pair)] = s1_capability(report, region, pair)
              return matrix

          def gain_paths(old_report, new_report):
              pairs = requested_pairs(new_report) or requested_pairs(old_report)
              old = capability_matrix(old_report, pairs)
              new = capability_matrix(new_report, pairs)
              return [
                  ".".join(key)
                  for key, value in new.items()
                  if value and not old.get(key, False)
              ]

          # Regresyon: sürüm-1 dış alanından sürüm-2 operasyon_odagi alanına
          # taşınmak tek başına yeni exact veri sayılmamalı.
          test_pair = "2026-09-13->2026-09-15"
          legacy = {
              "istenen_exact_ciftler": [test_pair],
              "sentinel2": {"cesme": {"exact_ciftler": {test_pair: {
                  "morfoloji": {"exact_cift_var": True},
                  "bsi": {"exact_cift_var": True},
              }}}},
          }
          migrated = {
              "istenen_exact_ciftler": [test_pair],
              "sentinel2": {"cesme": {"exact_ciftler": {test_pair: {
                  "morfoloji": {"exact_cift_var": True},
                  "bsi": {"exact_cift_var": True},
                  "operasyon_odagi": {
                      "morfoloji": {"exact_cift_var": True},
                      "bsi": {"exact_cift_var": True},
                  },
              }}}},
              "diagnostik": {"exact_cift_var": True},
          }
          assert gain_paths(legacy, migrated) == []

          no_pair = {"istenen_exact_ciftler": [test_pair]}
          s2_gain = {
              "istenen_exact_ciftler": [test_pair],
              "sentinel2": {"cesme": {"exact_ciftler": {test_pair: {
                  "operasyon_odagi": {
                      "morfoloji": {"exact_cift_var": True},
                      "bsi": {"exact_cift_var": False},
                  },
              }}}},
          }
          assert gain_paths(no_pair, s2_gain) == [f"sentinel2.cesme.{test_pair}"]

          s1_gain = {
              "istenen_exact_ciftler": [test_pair],
              "sentinel1": {"uzunkuyu": {"exact_ciftler": {test_pair: {
                  "exact_cift_var": True,
              }}}},
          }
          assert gain_paths(no_pair, s1_gain) == [f"sentinel1.uzunkuyu.{test_pair}"]

          gains = gain_paths(previous, current)
          with github_output.open("a", encoding="utf-8") as handle:
              handle.write(f"critical_exact_gain={'true' if gains else 'false'}\n")
              handle.write("critical_exact_gain_count=" + str(len(gains)) + "\n")
          if gains:
              print("Yeni hesaplanabilir exact kritik pencere kapasitesi bulundu:")
              for gain in gains:
                  print(f"- {gain}")
          else:
              print("Yeni hesaplanabilir exact kritik pencere kapasitesi yok.")
          PY

      - name: Yalnız semantik değişiklik varsa kaydet
        run: |
          output="special_window_scene_availability_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "Exact sahne uygunluğu değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python special_window_scene_availability_audit.py --check-only
            python special_window_scene_availability_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde sahne uygunluğu değişmedi."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: 15-17 Eylül exact sahne uygunluğunu güncelle"
            if git push origin HEAD:main; then
              echo "Exact sahne uygunluğu kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Exact sahne uygunluğu üç denemede kaydedilemedi."
          exit 1

      - name: Yeni exact kritik pencere çifti varsa ana radar zincirini başlat
        if: steps.exact_window.outputs.critical_exact_gain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Yeni hesaplanabilir exact 13/15/16/17 Eylül kapasitesi: ${{ steps.exact_window.outputs.critical_exact_gain_count }} sensör/bölge/çift."
          echo "Bu sahne en güncel ürün olmayabilir; geç yayımlanan tarihsel veri de tam taramayı tetikler."

          response_code="$(curl -sS -o /tmp/daily-dispatch-response.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/daily-scan.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [[ "$response_code" != "204" ]]; then
            cat /tmp/daily-dispatch-response.txt
            echo "Yeni exact kritik pencere verisi için tam radar taraması başlatılamadı; HTTP ${response_code}."
            exit 1
          fi
          echo "Yeni exact kritik pencere verisi tam radar taramasına bağlandı."
