name: Sentinel Kör Alan Denetimi

on:
  push:
    branches: [main]
    paths:
      - "coverage_blind_area_audit.py"
      - "coverage_blind_area_runner.py"
      - "coverage_patrol_shortlist.py"
      - "calibration_rotation_guard.py"
      - "route_diversity_guard.py"
      - "coverage_overlap_rotation_guard.py"
      - "final_calibration_diversity_guard.py"
      - ".github/workflows/coverage-blind-audit.yml"
  workflow_run:
    # Normal günlük zincirde önce tarama dry_ground_gap_audit.json'u üretir,
    # ardından Kuru Zemin Zaman Serisi Denetimi aynı Sentinel çiftini geçmiş
    # sahneyle karşılaştırır. Kör-alan/kalibrasyon rotası bu ikinci adım bittikten
    # sonra çalışsın ki ani-başlangıç önceliği eski temporal JSON ile yarışmasın.
    # Temporal çıktı eski/uyuşmayan olursa calibration_rotation_guard zaten güvenli
    # biçimde normal rotasyona geri düşer.
    workflows: ["Kuru Zemin Zaman Serisi Denetimi"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Sentinel kör alanını ölç ve devriye havuzunu çeşitlendir
        run: python coverage_blind_area_runner.py

      - name: Kör alan saha devriyesini güncelle
        run: python coverage_patrol_shortlist.py

      - name: Geniş temporal aday havuzunu aynı Sentinel çiftiyse uygula
        run: python temporal_candidate_pool.py --apply

      - name: Kuru zemin kalibrasyon noktalarını döndür
        run: python calibration_rotation_guard.py

      - name: Alarm dışı saha kontrolünü mahalle bazında çeşitlendir
        run: python route_diversity_guard.py

      - name: Çekirdek korumasında örtüşme ceplerini dönüşümlü kapat
        run: python coverage_overlap_rotation_guard.py

      - name: Nihai kör alan rotasına göre kalibrasyon tekrarını azalt
        run: python final_calibration_diversity_guard.py

      - name: Kanonik kuru zemin raporunu geri yükle
        run: git checkout -- dry_ground_gap_audit.json

      - name: Değişen kör alan raporunu kaydet
        run: |
          report_files="coverage_blind_area_audit.json latest_report.json SAHA_RAPORU.md"
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Kör alan ölçümü ve saha devriyesi değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add $report_files
          git commit -m "Radar: Sentinel kör alan raporunu ve devriyeyi güncelle"

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal değişti; eski ölçümü üzerine yazmadan sonraki çalışmaya bırakılıyor."
            exit 1
          fi
          git push origin HEAD:main
