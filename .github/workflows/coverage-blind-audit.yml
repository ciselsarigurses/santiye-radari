name: Sentinel Kör Alan Denetimi

on:
  push:
    branches: [main]
    paths:
      - "coverage_blind_area_audit.py"
      - "coverage_blind_area_runner.py"
      - "coverage_patrol_shortlist.py"
      - "coastal_false_positive_audit.py"
      - "stale_coastal_task_audit.py"
      - "coastal_route_guard.py"
      - "calibration_rotation_guard.py"
      - "temporal_calibration_rotation_guard.py"
      - "completed_calibration_guard.py"
      - "overdue_route_rotation_guard.py"
      - "calibration_note_guard.py"
      - "route_diversity_guard.py"
      - "coverage_overlap_rotation_guard.py"
      - "final_calibration_diversity_guard.py"
      - "calibration_cross_layer_diversity_guard.py"
      - "preseason_route_final_guard.py"
      - ".github/workflows/coverage-blind-audit.yml"
  workflow_run:
    # Normal günlük zincirde önce tarama dry_ground_gap_audit.json'u üretir,
    # ardından Kuru Zemin Zaman Serisi Denetimi aynı Sentinel çiftini geçmiş
    # sahneyle karşılaştırır. Kör-alan/kalibrasyon rotası bu ikinci adım bittikten
    # sonra çalışsın ki ani-başlangıç önceliği eski temporal JSON ile yarışmasın.
    # Temporal çıktı eski/uyuşmayan olursa calibration_rotation_guard zaten güvenli
    # biçimde normal rotasyona geri düşer.
    workflows: ["Kuru Zemin Zaman Serisi Denetimi"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Sentinel kör alanını ölç ve devriye havuzunu çeşitlendir
        run: python coverage_blind_area_runner.py

      - name: Saha doğrulamalı kıyı yanlış pozitiflerini tampon senaryolarıyla ölç
        run: python coastal_false_positive_audit.py

      - name: Güncel kıyı filtresine düşen eski açık görevleri ölç
        run: python stale_coastal_task_audit.py

      - name: Kör alan saha devriyesini güncelle
        run: python coverage_patrol_shortlist.py

      - name: Geniş temporal aday havuzunu aynı Sentinel çiftiyse uygula
        run: python temporal_candidate_pool.py --apply

      - name: Kuru zemin kalibrasyon noktalarını döndür
        run: python calibration_rotation_guard.py

      - name: Temporal kalibrasyon rotasyonu öz testi
        run: python temporal_calibration_rotation_guard.py --check-only

      - name: Temporal ani başlangıç kalibrasyonunu yerellik riskiyle döndür
        run: python temporal_calibration_rotation_guard.py

      - name: Tamamlanan kalibrasyon koruması öz testi
        run: python completed_calibration_guard.py --check-only

      - name: Saha etiketi tamamlanan kalibrasyonu yeni güvenli noktayla değiştir
        run: python completed_calibration_guard.py

      - name: Alarm dışı saha kontrolünü mahalle bazında çeşitlendir
        run: python route_diversity_guard.py

      - name: Çekirdek korumasında örtüşme ceplerini dönüşümlü kapat
        run: python coverage_overlap_rotation_guard.py

      - name: Nihai kör alan rotasına göre kalibrasyon tekrarını azalt
        run: python final_calibration_diversity_guard.py

      # Katmanlar-arası koruma günlük ilk-3 rotasının sonucunu okur. Bu yüzden önce
      # gecikmiş görev rotasını kesinleştiriyoruz; aksi halde gece yarısından sonra
      # kalibrasyon dünkü ilk-3 listesine göre çeşitlenebilirdi.
      - name: Gecikmiş günlük rota rotasyonu öz testi
        run: python overdue_route_rotation_guard.py --check-only

      - name: Gecikmiş ilk üç saha kontrolünü eş kalite bandında döndür
        run: python overdue_route_rotation_guard.py

      - name: Güncel kıyı filtresine düşen eski görevi ilk üçten koru
        run: python coastal_route_guard.py

      - name: Katmanlar arası kalibrasyon çeşitliliği öz testi
        run: python calibration_cross_layer_diversity_guard.py --check-only

      - name: Nihai ana rota ve kör alanla aynı mahalledeki eş kalite kalibrasyonu çeşitlendir
        run: python calibration_cross_layer_diversity_guard.py

      - name: Kalibrasyon açıklama tutarlılığı öz testi
        run: python calibration_note_guard.py --check-only

      - name: Kalibrasyon açıklamasını gerçek temporal rotasyonla eşleştir
        run: python calibration_note_guard.py

      - name: 15 Eylül öncesi saha rota invariantını son kez doğrula
        run: python preseason_route_final_guard.py

      - name: Kanonik kuru zemin raporunu geri yükle
        run: git checkout -- dry_ground_gap_audit.json

      - name: Değişen kör alan raporunu kaydet
        run: |
          report_files="coverage_blind_area_audit.json coastal_false_positive_audit.json stale_coastal_task_audit.json latest_report.json SAHA_RAPORU.md"

          refresh_reports() {
            python coverage_blind_area_runner.py
            python coastal_false_positive_audit.py
            python stale_coastal_task_audit.py
            python coverage_patrol_shortlist.py
            python temporal_candidate_pool.py --apply
            python calibration_rotation_guard.py
            python temporal_calibration_rotation_guard.py --check-only
            python temporal_calibration_rotation_guard.py
            python completed_calibration_guard.py --check-only
            python completed_calibration_guard.py
            python route_diversity_guard.py
            python coverage_overlap_rotation_guard.py
            python final_calibration_diversity_guard.py
            python overdue_route_rotation_guard.py --check-only
            python overdue_route_rotation_guard.py
            python coastal_route_guard.py
            python calibration_cross_layer_diversity_guard.py --check-only
            python calibration_cross_layer_diversity_guard.py
            python calibration_note_guard.py --check-only
            python calibration_note_guard.py
            python preseason_route_final_guard.py
            git checkout -- dry_ground_gap_audit.json
          }

          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Kör alan ölçümü, kıyı yanlış pozitif auditleri ve saha devriyesi değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # latest_report.json başka koruma workflow'ları tarafından da yazılıyor.
          # Main ilerlediyse eski raporu zorla birleştirmek yerine en güncel main
          # üzerinde bütün kör-alan/rota zincirini yeniden üret. Böylece yeni saha
          # geri bildirimi veya geniş-yüzey/parsel katmanı kaybolmaz.
          for attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Main ilerledi; kör-alan raporu güncel veri üzerinde yeniden üretiliyor (${attempt}/3)."
              git reset --hard origin/main
              refresh_reports
            fi

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "En güncel main üzerinde ek kör-alan rapor değişikliği gerekmiyor."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: Sentinel kör alan raporunu ve devriyeyi güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main yeniden ilerledi veya geçici push hatası oluştu; güvenli biçimde tekrar deneniyor (${attempt}/3)."
            git reset --hard HEAD~1
            sleep $((attempt * 2))
          done

          echo "Kör alan raporu üç güvenli denemede güncel main üzerine kaydedilemedi."
          exit 1
