name: Gülbahçe Kapsama Koruması

on:
  push:
    branches: [main]
    paths:
      - "satellite.py"
      - "gulbahce_coverage_guard.py"
      - ".github/workflows/gulbahce-coverage-guard.yml"
  workflow_run:
    workflows: ["Sentinel Kör Alan Denetimi"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-gulbahce-coverage
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Gülbahçe kapsama koruması öz testi
        run: python gulbahce_coverage_guard.py --self-check

      - name: Gülbahçe operasyon tamponunu ölç
        run: python gulbahce_coverage_guard.py

      - name: Son ana dal üzerinde sonucu güvenli biçimde kaydet
        run: |
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Kapsama sonucu kaydetme denemesi: ${attempt}/3"

            # Başka bir workflow bu sırada main'e sonuç yazdıysa eski checkout'tan
            # üretilmiş JSON'u taşımak yerine her seferinde en güncel ana dalda
            # yeniden hesapla. Böylece yeni satellite.py sınırları kaybolmaz.
            git fetch origin main
            git reset --hard origin/main
            python gulbahce_coverage_guard.py

            if [[ -z "$(git status --porcelain -- gulbahce_coverage_guard.json)" ]]; then
              echo "Gülbahçe kapsama sonucu güncel; commit gerekmiyor."
              exit 0
            fi

            git add gulbahce_coverage_guard.json
            git commit -m "Radar: Gülbahçe kapsama denetimini güncelle"

            # Commit ile push arasında main tekrar ilerlediyse non-fast-forward
            # zorlamak yerine bir sonraki turda yeni HEAD üzerinde yeniden hesapla.
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi

            echo "Ana dal kaydetme sırasında değişti; güncel HEAD üzerinde tekrar hesaplanacak."
          done

          echo "Gülbahçe kapsama sonucu 3 güvenli denemede kaydedilemedi."
          exit 1
