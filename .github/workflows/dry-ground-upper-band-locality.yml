name: Kuru Zemin Üst Bant Yerellik Denetimi

on:
  push:
    branches: [main]
    paths:
      - "dry_ground_upper_band_locality.py"
      - "dry_ground_upper_band_watch.json"
      - "dry_ground_temporal_audit.json"
      - ".github/workflows/dry-ground-upper-band-locality.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-dry-ground-upper-band-locality
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Üst bant yerellik öz testini çalıştır
        run: python dry_ground_upper_band_locality.py --check-only

      - name: 901-2000 m² üst bant adayının 7x7 çevre yerelliğini ölç
        run: python dry_ground_upper_band_locality.py

      - name: Diagnostik sözleşmesini doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dry_ground_upper_band_locality.json").read_text(encoding="utf-8"))
          assert payload.get("ana_uretim_esigi_m2") == 250, payload.get("ana_uretim_esigi_m2")
          assert payload.get("mikro_santiye_bandi_m2") == [150, 249], payload.get("mikro_santiye_bandi_m2")
          assert payload.get("alarm") is False
          assert payload.get("saha_gorevi") is False
          assert payload.get("operasyonel") is False
          bad = []
          for key, region in (payload.get("bolgeler") or {}).items():
              if int(region.get("aday") or 0) > 0 and region.get("durum") != "ok":
                  bad.append((key, region.get("durum"), region.get("neden")))
          assert not bad, bad
          print(
              "Üst bant yerellik sözleşmesi OK: "
              f"aday={payload.get('ust_bant_aday_toplam', 0)}, "
              f"lokal={payload.get('ust_bant_lokal_destek_toplam', 0)}, "
              f"yaygın={payload.get('yaygin_cevre_riski_toplam', 0)}, "
              f"Gülbahçe2km={payload.get('gulbahce_2km_ust_bant_aday', 0)}"
          )
          PY

      - name: Diagnostik sonucu güvenli kaydet
        run: |
          if [[ -z "$(git status --porcelain -- dry_ground_upper_band_locality.json)" ]]; then
            echo "Üst bant yerellik diagnostik sonucu değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add dry_ground_upper_band_locality.json
          git commit -m "Radar: kuru zemin üst bant yerellik raporunu güncelle"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Main ilerledi; üst bant yerellik raporu güncel veride yeniden hesaplanıyor (${attempt}/3)."
              git reset --hard origin/main
              python dry_ground_upper_band_locality.py
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dry_ground_upper_band_locality.json").read_text(encoding="utf-8"))
          bad = [
              (key, region.get("durum"), region.get("neden"))
              for key, region in (payload.get("bolgeler") or {}).items()
              if int(region.get("aday") or 0) > 0 and region.get("durum") != "ok"
          ]
          assert payload.get("ana_uretim_esigi_m2") == 250
          assert payload.get("alarm") is False and payload.get("saha_gorevi") is False
          assert not bad, bad
          PY
              if [[ -z "$(git status --porcelain -- dry_ground_upper_band_locality.json)" ]]; then
                exit 0
              fi
              git add dry_ground_upper_band_locality.json
              git commit -m "Radar: kuru zemin üst bant yerellik raporunu güncelle"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Üst bant yerellik diagnostik raporu güvenli biçimde kaydedilemedi."
          exit 1
