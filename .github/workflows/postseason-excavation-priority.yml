name: 15 Eylül Taze Kazı Öncelik Koruması

on:
  push:
    branches: [main]
    paths:
      - "postseason_excavation_priority_guard.py"
      - "demolition_followup_priority_guard.py"
      # Mikro iz hafızası yeni Sentinel sahnesinde anlamlı değişirse, ana ve mikro
      # zincirlerin bitiş sırası ne olursa olsun sezon önceliği en güncel kanıtla yenilensin.
      - "micro_site_watchlist.json"
      - "postseason_fresh_evidence_guard.py"
      # Kuru-zemin DOĞRULAMA, iki günlük taze-kanıt retention ile korunan ana adayı
      # ilk üçten düşürmesin; entegrasyon köprüsü bunu self-check ile kilitler.
      - "postseason_dry_ground_retention_guard.py"
      # 250-900 m² güçlü temporal-lokal kalibrasyon izini sahneler arasında sakla;
      # yalnız sonraki bağımsız taze 250+ ana aday için sıralama kanıtı olarak kullan.
      - "temporal_local_precursor_guard.py"
      - "temporal_local_watch.json"
      - "temporal_local_precursor_watchlist.json"
      - "postseason_dry_ground_confirmation_guard.py"
      - "postseason_capacity_preview.py"
      - ".github/workflows/postseason-excavation-priority.yml"
  workflow_run:
    workflows:
      - "Parsel Ön Kontrol Bağlantıları"
      - "Kuru Zemin Zaman Serisi Denetimi"
      - "Saha Durumunu İşle"
    types: [completed]
  schedule:
    # 15 Eylül 05:30 TSİ: sezon sınırını 11:00 ana taramadan önce uygula.
    # Guard tarih-duyarlıdır; eşik, alarm veya yeni görev üretme politikasını değiştirmez.
    - cron: "30 2 15 9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-postseason-excavation-priority
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: 15 Eylül taze kazı önceliği öz testi
        run: python postseason_excavation_priority_guard.py --self-check

      - name: Yıkım sonrası yeni hareket önceliği öz testi
        run: python demolition_followup_priority_guard.py --self-check

      - name: 15 Eylül taze Sentinel kanıt retention öz testi
        run: python postseason_fresh_evidence_guard.py --self-check

      - name: Temporal-lokal öncül iz hafızası öz testi
        run: python temporal_local_precursor_guard.py --self-check

      - name: 15 Eylül kuru zemin teyit + retention entegrasyon öz testi
        run: python postseason_dry_ground_retention_guard.py --self-check

      - name: 15 Eylül şantiye kapasite önizleme öz testi
        run: python postseason_capacity_preview.py --check-only

      - name: Sezon durumuna göre operasyon önceliğini uygula
        run: |
          python postseason_excavation_priority_guard.py
          python postseason_fresh_evidence_guard.py
          python temporal_local_precursor_guard.py
          python postseason_dry_ground_retention_guard.py
          python demolition_followup_priority_guard.py
          python postseason_capacity_preview.py

      - name: Yalnız değişiklik varsa güvenli biçimde kaydet
        run: |
          report_files="latest_report.json SAHA_RAPORU.md postseason_capacity_preview.json temporal_local_precursor_watchlist.json"

          normalize_timestamp_only_precursor() {
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("temporal_local_precursor_watchlist.json")
          if not path.exists():
              raise SystemExit(0)

          try:
              previous_text = subprocess.check_output(
                  ["git", "show", "HEAD:temporal_local_precursor_watchlist.json"],
                  text=True,
              )
              previous = json.loads(previous_text)
              current = json.loads(path.read_text(encoding="utf-8"))
          except (subprocess.CalledProcessError, json.JSONDecodeError, OSError):
              raise SystemExit(0)

          def semantic(payload):
              normalized = dict(payload) if isinstance(payload, dict) else {}
              normalized.pop("guncelleme_tarihi", None)
              return normalized

          if semantic(previous) == semantic(current):
              path.write_text(previous_text, encoding="utf-8")
              print("Temporal-lokal öncül hafıza semantik olarak değişmedi; salt guncelleme_tarihi farkı geri alındı.")
          PY
          }

          normalize_timestamp_only_precursor
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "15 Eylül taze kazı/yıkım takip/öncül hafıza/kuru zemin/kapasite katmanı için semantik rapor değişikliği gerekmiyor."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # Başka bir rapor workflow'u aynı anda main'i ilerletirse en güncel rapor
          # üzerinde yeniden üret. Algılama koduna, SQLite'a ve Sentinel eşiklerine
          # dokunma; yalnız operasyon sırasını, yıkım takip önceliğini, öncül iz hafızasını,
          # görünür rapor notunu ve diagnostik kapasite önizlemesini güncelle.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python postseason_excavation_priority_guard.py --self-check
            python demolition_followup_priority_guard.py --self-check
            python postseason_fresh_evidence_guard.py --self-check
            python temporal_local_precursor_guard.py --self-check
            python postseason_dry_ground_retention_guard.py --self-check
            python postseason_capacity_preview.py --check-only
            python postseason_excavation_priority_guard.py
            python postseason_fresh_evidence_guard.py
            python temporal_local_precursor_guard.py
            python postseason_dry_ground_retention_guard.py
            python demolition_followup_priority_guard.py
            python postseason_capacity_preview.py
            normalize_timestamp_only_precursor

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "En güncel main üzerinde semantik ek değişiklik gerekmiyor."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: 15 Eylül sonrası taze kazı ve yıkım takip önceliğini güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main değişti veya geçici push hatası oluştu; güncel raporda yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "15 Eylül taze kazı/yıkım takip/öncül hafıza/kuru zemin/kapasite katmanı üç güvenli denemede kaydedilemedi."
          exit 1
