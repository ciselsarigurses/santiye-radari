name: Diyagonal Alt-Küme Koordinat Denetimi

on:
  push:
    branches: [main]
    paths:
      - "diagonal_child_coordinate_audit.py"
      - ".github/workflows/diagonal-child-coordinate-audit.yml"
  workflow_run:
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Alt-küme koordinat kalite kontrolü
        run: python diagonal_child_coordinate_audit.py --check-only

      - name: Güncel Sentinel geometrisini ölç
        run: python diagonal_child_coordinate_audit.py

      - name: Diagnostik sonucu kaydet
        run: |
          report_files="diagonal_child_coordinate_audit.json"
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Alt-küme koordinat diagnostiğinde değişiklik yok."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add $report_files
          git commit -m "Radar: diyagonal alt-küme koordinatlarını güncelle"

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal ilerledi; diagnostik güncel main üzerinde yeniden hesaplanıyor."
            git reset --hard origin/main
            pip install -r requirements.txt
            python diagonal_child_coordinate_audit.py --check-only
            python diagonal_child_coordinate_audit.py

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "Yeniden hesaplama sonrası kaydedilecek değişiklik yok."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: diyagonal alt-küme koordinatlarını güncelle"
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Ana dal yeniden ilerledi; eski diagnostik veriyi yazmamak için güvenli çıkış."
              exit 0
            fi
          fi

          git push origin HEAD:main
