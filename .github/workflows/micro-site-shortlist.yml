name: Mikro Şantiye Kısa Liste Filtresi

on:
  push:
    branches: [main]
    paths:
      - "micro_site_audit.json"
      - "micro_site_shortlist.py"
      - ".github/workflows/micro-site-shortlist.yml"
  schedule:
    - cron: "35 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Mikro kısa liste öz testini ve filtreyi çalıştır
        run: python micro_site_shortlist.py

      - name: Sonucu yalnız değişiklikte kaydet
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- micro_site_shortlist.json)" ]]; then
            echo "Mikro kısa liste değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add micro_site_shortlist.json
          git commit -m "Radar: mikro şantiye kısa listesini güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
