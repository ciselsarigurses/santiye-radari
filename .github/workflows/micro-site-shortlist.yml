name: Mikro Şantiye Kısa Liste Filtresi

on:
  workflow_run:
    workflows: ["Mikro Şantiye Diagnostik Taraması"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "micro_site_audit.json"
      - "micro_site_shortlist.py"
      - "micro_diagonal_recovery.py"
      - "gulbahce_micro_candidate_review.py"
      - "micro_spectral_borderline_guard.py"
      - "micro_spectral_borderline_runner.py"
      - ".github/workflows/micro-site-shortlist.yml"
  schedule:
    # workflow_run ana yol; bu takvim olası zincir kesintisine karşı emniyet ağıdır.
    - cron: "35 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  shortlist:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Mikro kısa liste öz testini ve filtreyi çalıştır
        run: python micro_site_shortlist.py

      - name: Diyagonal MİKRO kurtarmalarda yakınlığı tek başına eleme nedeni yapma
        run: python micro_diagonal_recovery.py --augment-shortlist

      - name: Gülbahçe ham mikro adaylarının eleme nedenini açıkla
        run: python gulbahce_micro_candidate_review.py

      - name: Spektral sınır MİKRO diagnostik katmanını güncelle
        run: python micro_spectral_borderline_runner.py

      - name: Sonucu yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          report_files="micro_site_shortlist.json gulbahce_micro_candidate_review.json micro_spectral_borderline_review.json"

          # Spektral sınır katmanı her çalışmada üretim saatini yeniler. Aday/kanıt/
          # kaynak Sentinel bağlamı aynıysa yalnız timestamp yüzünden bot commit'i atma.
          if git ls-files --error-unmatch micro_spectral_borderline_review.json >/dev/null 2>&1; then
            meaningful="$(git diff -- micro_spectral_borderline_review.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
            if [[ -z "$meaningful" ]]; then
              echo "Spektral sınır katmanında yalnız çalışma zamanı değişti; dosya geri alınıyor."
              git checkout -- micro_spectral_borderline_review.json
            fi
          fi

          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Mikro kısa liste, Gülbahçe açıklaması ve spektral sınır katmanı değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add $report_files
          git commit -m "Radar: mikro kısa liste, Gülbahçe ve spektral sınır katmanını güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
