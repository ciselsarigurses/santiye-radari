name: Geniş Yüzey Arka Plan Koruması

on:
  push:
    branches: [main]
    paths:
      - "wide_surface_background_guard.py"
      - "wide_surface_provenance_gap_guard.py"
      - "historical_wide_backlog_guard.py"
      - "operational_report_numbering_guard.py"
      - ".github/workflows/wide-surface-background.yml"
  workflow_run:
    workflows:
      - "Günlük Şantiye Taraması"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-wide-surface-background
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Geniş yüzey arka-plan öz testi
        run: python wide_surface_background_guard.py --check-only

      - name: Yaklaşık provenans öz testi
        run: python wide_surface_provenance_gap_guard.py --check-only

      - name: Tarihsel geniş backlog öz testi
        run: python historical_wide_backlog_guard.py --check-only

      - name: Saha raporu sıra öz testi
        run: python operational_report_numbering_guard.py --check-only

      - name: Operasyon ve arka-plan katmanlarını ayır
        run: |
          python wide_surface_provenance_gap_guard.py
          python historical_wide_backlog_guard.py
          python operational_report_numbering_guard.py

      - name: Yalnız değişiklik varsa güvenli biçimde kaydet
        run: |
          report_files="latest_report.json SAHA_RAPORU.md wide_surface_background_review.json"
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Geniş yüzey arka-plan katmanı zaten güncel."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # Başka bir rapor workflow'u aynı anda main'i ilerletirse en güncel
          # rapor üzerinde üç geniş-yüzey katmanını ve sıra korumasını tekrar üret.
          # SQLite veya algılama kodunu bu workflow değiştirmez; yalnız rapor sunumunu
          # ve diagnostik review'u yazar.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python wide_surface_background_guard.py --check-only
            python wide_surface_provenance_gap_guard.py --check-only
            python historical_wide_backlog_guard.py --check-only
            python operational_report_numbering_guard.py --check-only
            python wide_surface_provenance_gap_guard.py
            python historical_wide_backlog_guard.py
            python operational_report_numbering_guard.py

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "En güncel main üzerinde ek değişiklik gerekmiyor."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: geniş yüzey hareketlerini arka planda ayır"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main değişti veya geçici push hatası oluştu; güncel rapor üzerinde yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Geniş yüzey arka-plan katmanı üç güvenli denemede kaydedilemedi."
          exit 1
