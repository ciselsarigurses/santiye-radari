name: Temel Kazısı Morfoloji Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "foundation_excavation_morphology_audit.py"
      - "foundation_excavation_agri_shadow_guard.py"
      - "excavation_reference_signature_audit.py"
      - "localized_excavation_seed_audit.py"
      - "localized_excavation_reference_rank_audit.py"
      - "seed_centered_excavation_morphology_audit.py"
      - "foundation_excavation_reference_similarity_audit.py"
      - "foundation_excavation_sar_seed_audit.py"
      - "foundation_excavation_cross_evidence_audit.py"
      - "foundation_excavation_cross_evidence_reconcile.py"
      - "foundation_excavation_route_gate_audit.py"
      - "foundation_excavation_core_fp_route_policy.py"
      - "foundation_excavation_one_plus_four_route_policy.py"
      - "temporal_field_feedback_regression_guard.py"
      - "sentinel1_rtc_change_diagnostic.py"
      - "sentinel1_rtc_map.geojson"
      - "sentinel1_scene_probe.py"
      - "sentinel1_blind_target_bridge.py"
      - "satellite.py"
      - "manual_field_feedback.json"
      - ".github/workflows/foundation-excavation-morphology-audit.yml"
  workflow_run:
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
  # workflow_run ana tetikleyicidir. GitHub bağımlı-workflow olayını geciktirir
  # veya kaçırırsa, ana taramaların (08/12/16 UTC) yaklaşık 3,5 saat sonrasında
  # tazelik fallback'i diagnostikleri yeniden üretir. Yeni servis/secret gerekmez.
  schedule:
    - cron: "30 11,15,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-foundation-morphology
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt 'planetary-computer>=1.0,<2'

      - name: Temel kazısı diagnostik öz testleri
        run: |
          python foundation_excavation_morphology_audit.py --check-only
          python foundation_excavation_agri_shadow_guard.py --check-only
          python excavation_reference_signature_audit.py --check-only
          python localized_excavation_seed_audit.py --check-only
          python localized_excavation_reference_rank_audit.py --check-only
          python seed_centered_excavation_morphology_audit.py --check-only
          python foundation_excavation_reference_similarity_audit.py --check-only
          python foundation_excavation_sar_seed_audit.py --check-only
          python foundation_excavation_cross_evidence_audit.py --check-only
          python foundation_excavation_cross_evidence_reconcile.py --check-only
          python foundation_excavation_route_gate_audit.py --check-only
          python foundation_excavation_core_fp_route_policy.py --check-only
          python foundation_excavation_one_plus_four_route_policy.py --check-only
          python temporal_field_feedback_regression_guard.py --check-only

      - name: Morfoloji ve saha referans diagnostiklerini üret
        run: |
          python foundation_excavation_morphology_audit.py
          python foundation_excavation_agri_shadow_guard.py
          python excavation_reference_signature_audit.py
          python localized_excavation_seed_audit.py
          python localized_excavation_reference_rank_audit.py
          python seed_centered_excavation_morphology_audit.py
          python foundation_excavation_reference_similarity_audit.py
          python foundation_excavation_sar_seed_audit.py
          python foundation_excavation_cross_evidence_audit.py
          python foundation_excavation_cross_evidence_reconcile.py
          python temporal_field_feedback_regression_guard.py
          python foundation_excavation_route_gate_audit.py
          python foundation_excavation_core_fp_route_policy.py
          python foundation_excavation_one_plus_four_route_policy.py

      - name: Çekirdek 1+4 regresyon koordinat bütünlüğünü doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "FN-20260916-CESME-001": ("DOGRULANMIS_KAZI", 38.341846, 26.432861),
              "FP-20260916-REISDERE-001": ("YANLIS_POZITIF", 38.322140, 26.407912),
              "FP-20260917-UZUNKUYU-001": ("YANLIS_POZITIF", 38.320150, 26.562138),
              "FP-20260917-MUSALLA-001": ("YANLIS_POZITIF", 38.313186, 26.307059),
              "FP-20260917-MUSALLA-002": ("YANLIS_POZITIF", 38.308120, 26.326863),
          }

          payload = json.loads(Path("excavation_reference_signature_review.json").read_text(encoding="utf-8"))
          found = {}
          for region in (payload.get("bolgeler") or {}).values():
              if not isinstance(region, dict):
                  continue
              for row in region.get("referanslar") or []:
                  if isinstance(row, dict) and row.get("id") in expected:
                      found[row["id"]] = row

          missing = sorted(set(expected) - set(found))
          if missing:
              raise SystemExit(f"Çekirdek 1+4 regresyon referansı eksik: {missing}")

          for item_id, (expected_result, expected_lat, expected_lon) in expected.items():
              row = found[item_id]
              actual_result = str(row.get("sonuc") or "").upper()
              try:
                  actual_lat = float(row["enlem"])
                  actual_lon = float(row["boylam"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(f"{item_id} koordinatı okunamadı: {exc}") from exc
              if actual_result != expected_result:
                  raise SystemExit(
                      f"{item_id} saha sonucu değişti: {actual_result!r} != {expected_result!r}"
                  )
              if abs(actual_lat - expected_lat) > 0.000001 or abs(actual_lon - expected_lon) > 0.000001:
                  raise SystemExit(
                      f"{item_id} koordinatı regresyon setinden saptı: "
                      f"({actual_lat:.6f},{actual_lon:.6f}) != "
                      f"({expected_lat:.6f},{expected_lon:.6f})"
                  )

          similarity = json.loads(Path("foundation_excavation_reference_similarity_review.json").read_text(encoding="utf-8"))
          if similarity.get("cekirdek_regresyon_tam") is not True:
              raise SystemExit("Çekirdek 1+4 regresyon seti tam değil.")
          if int(similarity.get("cekirdek_regresyon_pozitif_referans_sayisi") or 0) != 1:
              raise SystemExit("Çekirdek pozitif referans sayısı 1 değil.")
          if int(similarity.get("cekirdek_regresyon_yanlis_pozitif_referans_sayisi") or 0) != 4:
              raise SystemExit("Çekirdek yanlış-pozitif referans sayısı 4 değil.")

          print("Çekirdek 1+4 regresyon koordinat bütünlüğü: OK")
          PY

      - name: Seed-merkezli etkin 1+4 regresyonunu doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          core_ids = {
              "FN-20260916-CESME-001",
              "FP-20260916-REISDERE-001",
              "FP-20260917-UZUNKUYU-001",
              "FP-20260917-MUSALLA-001",
              "FP-20260917-MUSALLA-002",
          }
          payload = json.loads(
              Path("seed_centered_excavation_morphology_review.json").read_text(encoding="utf-8")
          )
          found = {}
          for region in (payload.get("bolgeler") or {}).values():
              if not isinstance(region, dict):
                  continue
              if region.get("durum") != "ok":
                  raise SystemExit(f"Seed-merkezli regresyon bölgesi sağlıklı değil: {region.get('durum')}")
              for row in region.get("saha_referans_regresyonu") or []:
                  if isinstance(row, dict) and row.get("id") in core_ids:
                      found[row["id"]] = row

          missing = sorted(core_ids - set(found))
          if missing:
              raise SystemExit(f"Seed-merkezli etkin regresyonda çekirdek referans eksik: {missing}")

          mismatched = sorted(
              item_id for item_id, row in found.items()
              if row.get("regresyon_uyumlu") is not True
          )
          if mismatched:
              raise SystemExit(f"Seed-merkezli etkin 1+4 regresyonu bozuldu: {mismatched}")

          if int(payload.get("toplam_regresyon_uyumsuz") or 0) != 0:
              raise SystemExit(
                  "Seed-merkezli morfoloji katmanında saha regresyon uyumsuzluğu var: "
                  f"{payload.get('toplam_regresyon_uyumsuz')}"
              )

          print("Seed-merkezli etkin 1+4 regresyonu: OK")
          PY

      - name: Diagnostik sonuçlarını güvenli kaydet
        run: |
          outputs="foundation_excavation_morphology_review.json foundation_excavation_agri_shadow_review.json excavation_reference_signature_review.json localized_excavation_seed_review.json localized_excavation_reference_rank_review.json seed_centered_excavation_morphology_review.json foundation_excavation_reference_similarity_review.json foundation_excavation_sar_seed_review.json foundation_excavation_cross_evidence_review.json foundation_excavation_route_gate_review.json"
          if [[ -z "$(git status --porcelain -- $outputs)" ]]; then
            echo "Temel kazısı diagnostik sonuçları değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python foundation_excavation_morphology_audit.py --check-only
            python foundation_excavation_agri_shadow_guard.py --check-only
            python excavation_reference_signature_audit.py --check-only
            python localized_excavation_seed_audit.py --check-only
            python localized_excavation_reference_rank_audit.py --check-only
            python seed_centered_excavation_morphology_audit.py --check-only
            python foundation_excavation_reference_similarity_audit.py --check-only
            python foundation_excavation_sar_seed_audit.py --check-only
            python foundation_excavation_cross_evidence_audit.py --check-only
            python foundation_excavation_cross_evidence_reconcile.py --check-only
            python foundation_excavation_route_gate_audit.py --check-only
            python foundation_excavation_core_fp_route_policy.py --check-only
            python foundation_excavation_one_plus_four_route_policy.py --check-only
            python temporal_field_feedback_regression_guard.py --check-only
            python foundation_excavation_morphology_audit.py
            python foundation_excavation_agri_shadow_guard.py
            python excavation_reference_signature_audit.py
            python localized_excavation_seed_audit.py
            python localized_excavation_reference_rank_audit.py
            python seed_centered_excavation_morphology_audit.py
            python foundation_excavation_reference_similarity_audit.py
            python foundation_excavation_sar_seed_audit.py
            python foundation_excavation_cross_evidence_audit.py
            python foundation_excavation_cross_evidence_reconcile.py
            python temporal_field_feedback_regression_guard.py
            python foundation_excavation_route_gate_audit.py
            python foundation_excavation_core_fp_route_policy.py
            python foundation_excavation_one_plus_four_route_policy.py

            if [[ -z "$(git status --porcelain -- $outputs)" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add $outputs
            git commit -m "Radar: temel kazısı diagnostiklerini güncelle"
            if git push origin HEAD:main; then
              echo "Diagnostikler güvenli biçimde kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden denenecek."
            sleep $((attempt * 2))
          done

          echo "Üç denemede de diagnostik kaydı tamamlanamadı."
          exit 1
