name: Post-Onset SAR Süreklilik Uzlaştırması

on:
  push:
    branches: [main]
    paths:
      - "post_onset_sar_persistence_reconcile.py"
      - "post_onset_baseline_sar_bridge_review.json"
      - "post_onset_baseline_sar_cross_review.json"
      - "manual_field_feedback.json"
      - ".github/workflows/post-onset-sar-persistence-reconcile.yml"
  workflow_run:
    workflows:
      - "13 Eylül Baseline SAR Köprüsü"
      - "Baseline Sonrası SAR Çapraz Diagnostiği"
    types: [completed]
  # :55 baseline SAR köprüsünden sonra aynı saat içindeki iki SAR yorumunu uzlaştır.
  schedule:
    - cron: "58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-post-onset-sar-persistence-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Öz testi çalıştır
        run: python post_onset_sar_persistence_reconcile.py --check-only

      - name: SAR süreklilik kanıtını uzlaştır
        run: python post_onset_sar_persistence_reconcile.py

      - name: Diagnostiği güvenli kaydet
        run: |
          output="post_onset_sar_persistence_review.json"
          if [[ -z "$(git status --porcelain -- "$output")" ]]; then
            echo "SAR süreklilik uzlaştırmasında semantik değişiklik yok."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python post_onset_sar_persistence_reconcile.py --check-only
            python post_onset_sar_persistence_reconcile.py

            if [[ -z "$(git status --porcelain -- "$output")" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: post-onset SAR süreklilik diagnostiğini güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden denenecek (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "SAR süreklilik diagnostik kaydı tamamlanamadı."
          exit 1
