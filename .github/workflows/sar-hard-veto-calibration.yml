name: SAR Zorunlu Veto Kalibrasyon Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "sar_hard_veto_calibration_audit.py"
      - "foundation_excavation_sar_seed_review.json"
      - "manual_field_feedback.json"
      - ".github/workflows/sar-hard-veto-calibration.yml"
  workflow_run:
    workflows: ["Temel Kazısı Morfoloji Diagnostiği"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-sar-hard-veto-calibration
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: SAR zorunlu veto öz testi
        run: python sar_hard_veto_calibration_audit.py --check-only

      - name: SAR zorunlu veto kalibrasyonunu ölç
        run: python sar_hard_veto_calibration_audit.py

      - name: Diagnostiği güvenli kaydet
        run: |
          output="sar_hard_veto_calibration_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "SAR zorunlu veto kalibrasyon diagnostiği değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python sar_hard_veto_calibration_audit.py --check-only
            python sar_hard_veto_calibration_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add $output
            git commit -m "Radar: SAR zorunlu veto kalibrasyonunu güncelle"
            if git push origin HEAD:main; then
              echo "SAR zorunlu veto kalibrasyonu kaydedildi."
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden denenecek."
            sleep $((attempt * 2))
          done

          echo "Üç denemede diagnostik kaydı tamamlanamadı."
          exit 1
