name: Gülbahçe Kör Alan Devriye Koruması

on:
  push:
    branches: [main]
    paths:
      - "gulbahce_blind_patrol_guard.py"
      - "gulbahce_current_blind_patrol_bridge.py"
      - "gulbahce_current_blind_urgency_guard.py"
      - "gulbahce_sar_blind_priority_guard.py"
      - "gulbahce_patrol_surface_guard.py"
      - "gulbahce_latest_state_blind_review.py"
      - "gulbahce_nearby_blind_check_guard.py"
      - "gulbahce_micro_blind_capacity.json"
      - "sentinel1_rtc_map.geojson"
      - "parcel_precheck_links.py"
      - "requirements.txt"
      - ".github/workflows/gulbahce-blind-patrol.yml"
  workflow_run:
    # Tam günlük tarama SAHA_RAPORU/latest_report dosyalarını yeniden ürettiği için
    # kör-alan katmanını da hemen geri uygula; aksi halde Gülbahçe devriyesi ertesi
    # günlük rotasyona kadar rapordan geçici olarak düşebiliyordu.
    workflows: ["Sentinel Kör Alan Denetimi", "Günlük Şantiye Taraması"]
    types: [completed]
  # Yeni Sentinel sahnesi gelmese bile insan kör-alan devriyesi günlük dönmeli.
  # Türkiye UTC+3 olduğundan 00:10 UTC = 03:10 Europe/Istanbul.
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-gulbahce-blind-patrol
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Günlük genel kör alan rotasyonunu güncelle
        run: python coverage_patrol_shortlist.py

      - name: Gülbahçe kör alan temsil koruması öz testi
        run: python gulbahce_blind_patrol_guard.py --check-only

      - name: Gülbahçe tarihsel kör alan temsilini uygula
        run: python gulbahce_blind_patrol_guard.py

      - name: Gülbahçe gerçek güncel-sahne körlük diagnostigi öz testi
        run: python gulbahce_latest_state_blind_review.py --check-only

      - name: En yeni sahne körlüğünü tarihsel kara/su kanıtıyla doğrula
        run: python gulbahce_latest_state_blind_review.py

      - name: Gülbahçe güncel-sahne körlük devriye köprüsü öz testi
        run: python gulbahce_current_blind_patrol_bridge.py --check-only

      - name: Güncel-sahne körlüğünü Gülbahçe duty devriyesinde öncele
        run: python gulbahce_current_blind_patrol_bridge.py

      - name: Seçilen devriyenin güncel körlüğü kapsamasını yeniden ölç
        run: python gulbahce_latest_state_blind_review.py

      - name: Gülbahçe güçlü SAR körlük önceliği öz testi
        run: python gulbahce_sar_blind_priority_guard.py --check-only

      - name: Güçlü SAR+temporal kanıtını güncel körlük devriyesinde öncele
        run: python gulbahce_sar_blind_priority_guard.py

      - name: SAR önceliği sonrası güncel körlük kapsamasını yeniden ölç
        run: python gulbahce_latest_state_blind_review.py

      - name: Gülbahçe taze güncel-körlük ara-gün koruması öz testi
        run: python gulbahce_current_blind_urgency_guard.py --check-only

      - name: Taze güncel-sahne körlüğünü ara günde güvenli devriyeye al
        run: python gulbahce_current_blind_urgency_guard.py

      - name: Ara-gün devriyesinin güncel körlüğü kapsamasını yeniden ölç
        run: python gulbahce_latest_state_blind_review.py

      - name: Gülbahçe su-kıyı devriye koruması öz testi
        run: python gulbahce_patrol_surface_guard.py --check-only

      - name: Güncel su-kıyı yüzeyini kör alan devriyesinden ayır
        run: python gulbahce_patrol_surface_guard.py

      - name: Su-kıyı koruması sonrası güncel körlük kapsamasını yeniden ölç
        run: python gulbahce_latest_state_blind_review.py

      - name: Gülbahçe yakın kör alan ek kontrol diagnostigi öz testi
        run: python gulbahce_nearby_blind_check_guard.py --check-only

      - name: Seçilen devriyeye yakın ikinci kör kümeyi diagnostik olarak işaretle
        run: python gulbahce_nearby_blind_check_guard.py

      - name: Manuel parsel ön-kontrol katmanı öz testi
        run: python parcel_precheck_links.py --self-check

      - name: Gülbahçe raporunda parsel ön-kontrol bilgisini koru
        run: python parcel_precheck_links.py

      - name: Güvenli rapor değişikliğini kaydet
        run: |
          report_files="latest_report.json SAHA_RAPORU.md gulbahce_latest_state_blind_review.json"

          refresh_guard() {
            python coverage_patrol_shortlist.py
            python gulbahce_blind_patrol_guard.py --check-only
            python gulbahce_blind_patrol_guard.py
            python gulbahce_latest_state_blind_review.py --check-only
            python gulbahce_latest_state_blind_review.py
            python gulbahce_current_blind_patrol_bridge.py --check-only
            python gulbahce_current_blind_patrol_bridge.py
            python gulbahce_latest_state_blind_review.py
            python gulbahce_sar_blind_priority_guard.py --check-only
            python gulbahce_sar_blind_priority_guard.py
            python gulbahce_latest_state_blind_review.py
            python gulbahce_current_blind_urgency_guard.py --check-only
            python gulbahce_current_blind_urgency_guard.py
            python gulbahce_latest_state_blind_review.py
            python gulbahce_patrol_surface_guard.py --check-only
            python gulbahce_patrol_surface_guard.py
            python gulbahce_latest_state_blind_review.py
            python gulbahce_nearby_blind_check_guard.py --check-only
            python gulbahce_nearby_blind_check_guard.py
            python parcel_precheck_links.py --self-check
            python parcel_precheck_links.py
          }

          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Gülbahçe kör alan temsilinde ve gerçek güncel-sahne diagnostiginde değişiklik gerekmiyor."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Main ilerledi; Gülbahçe kör alan koruması güncel raporda yeniden uygulanıyor (${attempt}/3)."
              git reset --hard origin/main
              refresh_guard
            fi

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "En güncel main üzerinde ek Gülbahçe değişikliği gerekmiyor."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: Gülbahçe kör alan devriyesini ve güncel-sahne diagnostigini güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main yeniden ilerledi veya geçici push hatası oluştu; güncel main üzerinde yeniden hesaplanıyor (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            refresh_guard
            sleep $((attempt * 2))
          done

          echo "Gülbahçe kör alan devriyesi üç güvenli denemede kaydedilemedi."
          exit 1
