name: Sentinel Yeni Sahne Hızlı Yoklama

on:
  push:
    branches: [main]
    paths:
      - "sentinel_scene_probe.py"
      - "sentinel1_scene_probe.py"
      - "sentinel1_blind_target_bridge.py"
      - "sentinel1_rtc_change_diagnostic.py"
      - "sentinel1_rtc_quality_guard.py"
      - "sentinel1_rtc_target_pair_gapfill.py"
      - "cloud_scene_probe.py"
      - ".github/workflows/sentinel-scene-probe.yml"
  schedule:
    # Sentinel metadata'sını saatlik yokla; tam tarama zaten 11:00/15:00/19:00'da
    # çalıştığı için dakikayı :35 seçerek aynı anda ikinci tarama başlatma riskini azalt.
    # Optik üretim/bulut için hafif metadata sorguları yapılır. SAR tarafında yalnız
    # optik kör alan hedeflerinde küçük RTC pencereleri okunur; tam sahne indirilmez.
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sentinel-scene-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Yoklama bağımlılıklarını kur
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<3' 'Pillow>=10,<12' 'rasterio>=1.4,<2' 'planetary-computer>=1.0,<2'

      - name: Yoklama mantığı öz testi
        run: |
          python sentinel_scene_probe.py --self-check-only
          python cloud_scene_probe.py --self-check-only
          python sentinel1_scene_probe.py --self-check-only
          python sentinel1_blind_target_bridge.py --self-check-only
          python sentinel1_rtc_change_diagnostic.py --self-check-only
          python sentinel1_rtc_quality_guard.py --self-check-only
          python sentinel1_rtc_target_pair_gapfill.py --self-check-only

      - name: Sentinel metadata'sında yeni üretim sahnesi ara
        id: probe
        run: python sentinel_scene_probe.py --github-output "$GITHUB_OUTPUT"

      - name: Global bulut filtresine takılan daha yeni sahneyi ara
        id: cloud_probe
        run: python cloud_scene_probe.py --github-output "$GITHUB_OUTPUT"

      - name: Sentinel-1 SAR kapsama tazeliğini diagnostik izle
        run: python sentinel1_scene_probe.py --live

      - name: Sentinel-1 SAR çiftini optik kör alan hedefleriyle eşle
        run: python sentinel1_blind_target_bridge.py --live

      - name: Sentinel-1 RTC lokal değişimini kör alan hedeflerinde diagnostik ölç
        run: python sentinel1_rtc_change_diagnostic.py --live | tee /tmp/sentinel1-rtc.json

      - name: Sentinel-1 RTC veri tazelik ve okunabilirlik kalite kapısını çalıştır
        run: python sentinel1_rtc_quality_guard.py --input /tmp/sentinel1-rtc.json

      - name: Bölgesel RTC çiftinin açıklarını hedefe özel taze çiftle diagnostik tamamla
        run: python sentinel1_rtc_target_pair_gapfill.py --live

      - name: Yeni üretim sahnesi varsa ana radar zincirini başlat
        if: steps.probe.outputs.new_scene == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Yeni Sentinel sahnesi: ${{ steps.probe.outputs.changed_regions }}"

          response_code="$(curl -sS -o /tmp/daily-dispatch-response.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/daily-scan.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [[ "$response_code" != "204" ]]; then
            cat /tmp/daily-dispatch-response.txt
            echo "Tam radar taraması başlatılamadı; HTTP ${response_code}."
            exit 1
          fi
          echo "Tam radar taraması workflow_dispatch ile başlatıldı."
          echo "MİKRO diagnostik, ana tarama başarıyla tamamlandığında workflow_run zinciriyle başlayacak."

      - name: Global bulut filtresine takılan sahne varsa yerel SCL auditini başlat
        if: steps.cloud_probe.outputs.cloud_audit_candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Global bulut metadata adayı: ${{ steps.cloud_probe.outputs.cloud_candidate_regions }}"
          echo "Alarm üretilmiyor; Çeşme/Uzunkuyu ve Gülbahçe 2 km yerel SCL açıklığı doğrulanacak."

          response_code="$(curl -sS -o /tmp/cloud-audit-dispatch-response.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/cloud-threshold-audit.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [[ "$response_code" != "204" ]]; then
            cat /tmp/cloud-audit-dispatch-response.txt
            echo "Yerel bulut körlük auditi başlatılamadı; HTTP ${response_code}."
            exit 1
          fi
          echo "Yerel SCL bulut körlük auditi workflow_dispatch ile başlatıldı."
