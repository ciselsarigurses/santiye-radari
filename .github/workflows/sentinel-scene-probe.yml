name: Sentinel Yeni Sahne Hızlı Yoklama

on:
  push:
    branches: [main]
    paths:
      - "sentinel_scene_probe.py"
      - ".github/workflows/sentinel-scene-probe.yml"
  schedule:
    # Sentinel metadata'sını saatlik yokla; tam tarama zaten 11:00/15:00/19:00'da
    # çalıştığı için dakikayı :35 seçerek aynı anda ikinci tarama başlatma riskini azalt.
    # Yeni sahne yoksa yalnız iki hafif STAC metadata sorgusu yapılır ve işlem biter.
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sentinel-scene-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Sentinel metadata'sında yeni sahne ara
        id: probe
        run: python sentinel_scene_probe.py --github-output "$GITHUB_OUTPUT"

      - name: Yeni sahne varsa mevcut tam radar taramasını başlat
        if: steps.probe.outputs.new_scene == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "Yeni Sentinel sahnesi: ${{ steps.probe.outputs.changed_regions }}"
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/daily-scan.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [[ "$response_code" != "204" ]]; then
            cat /tmp/dispatch-response.txt
            echo "Tam radar taraması başlatılamadı; HTTP ${response_code}."
            exit 1
          fi
          echo "Tam radar taraması workflow_dispatch ile başlatıldı."
