name: Operasyonel Rota Geometri Koruması

on:
  workflow_dispatch:
  schedule:
    # GITHUB_TOKEN ile atılan bot commitleri yeni push workflow'u açmayabilir.
    # Workflow-run zinciri kaçarsa rota en geç bir sonraki saatlik kontrolde yenilensin.
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - operational_route_shape_guard.py
      - operational_route_freshness_guard.py
      - operational_corridor_guard.py
      - route_coordinate_link_guard.py
      - .github/workflows/operational-route-shape-guard.yml
      - latest_report.json
      - site_scale_shape_risk_review.json
  workflow_run:
    workflows: ["Şantiye Ölçeği Şekil Risk Diagnostiği", "Günlük Şantiye Taraması", "15 Eylül Taze Kazı Öncelik Koruması"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: santiye-radari-operational-route-shape-guard
  cancel-in-progress: true

jobs:
  guard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Koruma testlerini çalıştır
        run: |
          python operational_route_shape_guard.py --self-check
          python operational_route_freshness_guard.py --self-check
          python route_coordinate_link_guard.py --self-check
          python operational_corridor_guard.py --self-check
          python foundation_excavation_operational_route_guard.py --check-only

      - name: Operasyonel rotayı üret
        run: |
          python operational_route_shape_guard.py
          python operational_route_freshness_guard.py
          python route_coordinate_link_guard.py
          python operational_corridor_guard.py

      - name: Değişiklik biçimini kontrol et
        run: git diff --check

      - name: Çıktıyı güvenli biçimde kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Kaynak rapor başka bir workflow tarafından aynı anda güncellendiyse,
          # en güncel main üzerinde dört rota korumasını yeniden hesapla ve en son
          # temel/kepçe çoklu-kanıt kapısını uygula. Böylece genel BSI/toprak değişimi
          # daha geç çalışan rota adımıyla tekrar KONTROLE_GIT'e dönemez.
          git restore operational_route.json latest_report.json SAHA_RAPORU.md 2>/dev/null || true
          git pull --rebase origin main
          python operational_route_shape_guard.py --self-check
          python operational_route_freshness_guard.py --self-check
          python route_coordinate_link_guard.py --self-check
          python operational_corridor_guard.py --self-check
          python foundation_excavation_operational_route_guard.py --check-only
          python operational_route_shape_guard.py
          python operational_route_freshness_guard.py
          python route_coordinate_link_guard.py
          python operational_corridor_guard.py
          python foundation_excavation_operational_route_guard.py
          git diff --check

          git add operational_route.json latest_report.json SAHA_RAPORU.md
          if git diff --cached --quiet; then
            echo "Operasyonel rota değişmedi; commit gerekmiyor."
            exit 0
          fi
          git commit -m "Rota: taze zemin, koridor ve temel-kazısı kapısını uygula"
          git push origin HEAD:main
