name: Kritik Başlangıç Penceresi Kalıcı Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/critical-onset-window-persist.yml"
  workflow_run:
    workflows:
      - "Sentinel Yeni Sahne Hızlı Yoklama"
      - "Kritik başlangıç penceresi Sentinel denetimi"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-critical-onset-window-persist
  cancel-in-progress: true

jobs:
  persist:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt 'planetary-computer>=1.0,<2'

      - name: Kritik pencere öz testi
        run: |
          python critical_onset_window_audit.py --self-check-only
          python critical_onset_latest_scene_audit.py --self-check-only

      - name: Veri gerçekliğini üret ve yalnız semantik değişiklikte kaydet
        shell: bash
        run: |
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          semantic_equal() {
            python - "$1" "$2" <<'PY'
          import json
          import sys
          from pathlib import Path

          old_path, new_path = map(Path, sys.argv[1:3])
          if not old_path.exists() or not new_path.exists():
              raise SystemExit(1)

          old = json.loads(old_path.read_text(encoding="utf-8"))
          new = json.loads(new_path.read_text(encoding="utf-8"))
          if isinstance(old, dict):
              old.pop("olusturma_utc", None)
          if isinstance(new, dict):
              new.pop("olusturma_utc", None)
          raise SystemExit(0 if old == new else 1)
          PY
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python critical_onset_window_audit.py --self-check-only
            python critical_onset_latest_scene_audit.py --self-check-only
            python critical_onset_window_audit.py --live --output /tmp/critical-onset-window.json
            python critical_onset_latest_scene_audit.py --live --output /tmp/critical-onset-latest-scene.json

            changed=0
            if ! semantic_equal critical_onset_window_availability.json /tmp/critical-onset-window.json; then
              cp /tmp/critical-onset-window.json critical_onset_window_availability.json
              changed=1
            fi
            if ! semantic_equal critical_onset_latest_scene.json /tmp/critical-onset-latest-scene.json; then
              cp /tmp/critical-onset-latest-scene.json critical_onset_latest_scene.json
              changed=1
            fi

            if [[ "$changed" -eq 0 ]]; then
              echo "Kritik başlangıç penceresi ve en güncel Sentinel veri gerçekliğinde semantik değişiklik yok."
              exit 0
            fi

            git add critical_onset_window_availability.json critical_onset_latest_scene.json
            git commit -m "Radar: kritik pencere ve en güncel Sentinel uygunluğunu güncelle"
            if git push origin HEAD:main; then
              echo "Kritik başlangıç penceresi ve en güncel Sentinel diagnostik kaydı güncellendi."
              exit 0
            fi

            echo "Main ilerledi; güncel veriyle yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Kritik başlangıç penceresi diagnostik kaydı üç denemede kaydedilemedi."
          exit 1
