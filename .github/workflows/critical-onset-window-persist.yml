name: Kritik Başlangıç Penceresi Kalıcı Diagnostiği

on:
  workflow_run:
    workflows: ["Sentinel Yeni Sahne Hızlı Yoklama"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-critical-onset-window-persist
  cancel-in-progress: true

jobs:
  persist:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt 'planetary-computer>=1.0,<2'

      - name: Kritik pencere öz testi
        run: python critical_onset_window_audit.py --self-check-only

      - name: Veri gerçekliğini üret ve yalnız semantik değişiklikte kaydet
        shell: bash
        run: |
          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          semantic_equal() {
            python - "$1" "$2" <<'PY'
          import json
          import sys
          from pathlib import Path

          old_path, new_path = map(Path, sys.argv[1:3])
          if not old_path.exists() or not new_path.exists():
              raise SystemExit(1)

          old = json.loads(old_path.read_text(encoding="utf-8"))
          new = json.loads(new_path.read_text(encoding="utf-8"))
          if isinstance(old, dict):
              old.pop("olusturma_utc", None)
          if isinstance(new, dict):
              new.pop("olusturma_utc", None)
          raise SystemExit(0 if old == new else 1)
          PY
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python critical_onset_window_audit.py --self-check-only
            python critical_onset_window_audit.py --live --output /tmp/critical-onset-window.json

            if semantic_equal critical_onset_window_availability.json /tmp/critical-onset-window.json; then
              echo "Kritik başlangıç penceresi veri gerçekliğinde semantik değişiklik yok."
              exit 0
            fi

            cp /tmp/critical-onset-window.json critical_onset_window_availability.json
            git add critical_onset_window_availability.json
            git commit -m "Radar: kritik 15-17 Eylül veri uygunluğunu güncelle"
            if git push origin HEAD:main; then
              echo "Kritik başlangıç penceresi diagnostik kaydı güncellendi."
              exit 0
            fi

            echo "Main ilerledi; güncel veriyle yeniden deneniyor (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Kritik başlangıç penceresi diagnostik kaydı üç denemede kaydedilemedi."
          exit 1
