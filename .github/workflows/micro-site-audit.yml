name: Mikro Şantiye Diagnostik Taraması

on:
  push:
    branches: [main]
    paths:
      - "micro_site_audit.py"
      - "satellite.py"
      - ".github/workflows/micro-site-audit.yml"
  schedule:
    # Ana 11:00 / 15:00 / 19:00 Sentinel taramasından kısa süre sonra çalışır.
    - cron: "25 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Radarın diğer bot commit'leriyle SQLite/rapor yazma yarışına girme.
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  micro-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Ana uydu kalite korumalarını doğrula
        run: python satellite_quality.py

      - name: 150-249 m² mikro diagnostik taramayı çalıştır
        run: python micro_site_audit.py

      - name: Sonucu yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          if git ls-files --error-unmatch micro_site_audit.json >/dev/null 2>&1; then
            meaningful="$(git diff -- micro_site_audit.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
            if [[ -z "$meaningful" ]]; then
              echo "Yalnız çalışma zamanı değişti; gereksiz veri commit'i yapılmıyor."
              git checkout -- micro_site_audit.json
              exit 0
            fi
          fi

          if [[ -z "$(git status --porcelain -- micro_site_audit.json)" ]]; then
            echo "Mikro diagnostik sonucu değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add micro_site_audit.json
          git commit -m "Radar: mikro şantiye diagnostik sonucunu güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
