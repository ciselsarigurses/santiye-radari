name: Mikro Şantiye Diagnostik Taraması

on:
  push:
    branches: [main]
    paths:
      - "micro_site_audit.py"
      - "micro_diagonal_recovery.py"
      - "gulbahce_micro_blind_capacity_guard.py"
      - "gulbahce_latest_state_blind_review.py"
      - "gulbahce_latest_state_blind_review.json"
      - "satellite.py"
      - ".github/workflows/micro-site-audit.yml"
  schedule:
    # Ana 11:00 / 15:00 / 19:00 Sentinel taramasından kısa süre sonra çalışır.
    - cron: "25 8,12,16 * * *"
  workflow_run:
    # Saatlik probe yeni sahne bulduğunda önce ana 250 m² tarama tamamlanır;
    # MİKRO ancak o workflow başarıyla bittikten sonra aynı DB-write grubuna girer.
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Radarın diğer bot commit'leriyle SQLite/rapor yazma yarışına girme.
  group: santiye-radari-db-write
  cancel-in-progress: false

jobs:
  micro-audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Ana uydu kalite korumalarını doğrula
        run: python satellite_quality.py

      - name: 150-249 m² mikro diagnostik taramayı çalıştır
        run: python micro_site_audit.py

      - name: Diyagonal MİKRO kurtarma güvenlik öz testini çalıştır
        run: python micro_diagonal_recovery.py --check-only

      - name: 8-komşuda yutulan güçlü MİKRO parçaları diagnostik havuza geri ekle
        run: python micro_diagonal_recovery.py --augment-audit

      - name: Gülbahçe mikro körlük kapasitesini ayır
        run: python gulbahce_micro_blind_capacity_guard.py

      - name: Sonucu yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          report_files="micro_site_audit.json gulbahce_micro_blind_capacity.json"

          normalize_micro_timestamp_only() {
            if git ls-files --error-unmatch micro_site_audit.json >/dev/null 2>&1; then
              meaningful="$(git diff -- micro_site_audit.json \
                | grep -E '^[+-]' \
                | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
              if [[ -z "$meaningful" ]]; then
                echo "Mikro auditte yalnız çalışma zamanı değişti; bu dosya geri alınıyor."
                git checkout -- micro_site_audit.json
              fi
            fi
          }

          regenerate_reports() {
            echo "Güncel main üzerinde MİKRO, diyagonal kurtarma ve Gülbahçe körlük diagnostikleri yeniden üretiliyor."
            python satellite_quality.py
            python micro_site_audit.py
            python micro_diagonal_recovery.py --check-only
            python micro_diagonal_recovery.py --augment-audit
            python gulbahce_micro_blind_capacity_guard.py
            normalize_micro_timestamp_only
          }

          normalize_micro_timestamp_only
          if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
            echo "Mikro diagnostik, diyagonal kurtarma ve Gülbahçe körlük kapasitesi değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # MİKRO taraması uzun sürerken başka bir bot main'i ilerletebilir. Eski
          # diagnostik JSON'u yeni main'in üstüne rebase etmek yerine en güncel kod
          # ve radar verisi üzerinde yeniden hesapla. Böylece 150-249 m² ve Gülbahçe
          # körlük çıktısı hiçbir zaman eski Sentinel/config durumuyla yayımlanmaz.
          for attempt in 1 2 3; do
            git fetch origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Main ilerledi; eski MİKRO sonucu taşınmadan güncel veri üzerinde yeniden hesaplanıyor (${attempt}/3)."
              git reset --hard origin/main
              regenerate_reports
            fi

            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "En güncel main üzerinde ek MİKRO diagnostik değişikliği gerekmiyor."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: mikro diagnostik ve Gülbahçe körlük kapasitesini güncelle"

            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Main commit sırasında yeniden ilerledi; diagnostik güncel main üzerinde tekrar hesaplanıyor (${attempt}/3)."
              git reset --hard origin/main
              regenerate_reports
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push sırasında main ilerlemiş veya geçici GitHub hatası oluşmuş olabilir; güncel main üzerinde tekrar hesaplanıyor (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            regenerate_reports
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "MİKRO diagnostik üç güvenli yeniden hesaplama denemesinde kaydedilemedi."
          exit 1
