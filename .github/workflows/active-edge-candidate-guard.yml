name: Aktif Aday Analiz Kenarı Koruması

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "active_edge_candidate_guard.py"
      - "satellite.py"
      - "hotspot_coordinate_audit.py"
      - ".github/workflows/active-edge-candidate-guard.yml"

permissions:
  contents: write

concurrency:
  group: santiye-radari-active-edge-candidate
  cancel-in-progress: true

jobs:
  guard:
    # Başarısız günlük taramanın çıktısını yeni/sağlıklı veri gibi ölçme.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Analiz kenarı koruması öz testi
        run: python active_edge_candidate_guard.py --self-test

      - name: Güncel ana Sentinel adaylarında kenar kırpma riskini ölç
        run: python active_edge_candidate_guard.py

      - name: Sonucu yalnız anlamlı değişiklikte güvenli kaydet
        shell: bash
        run: |
          if [[ ! -f active_edge_candidate_review.json ]]; then
            echo "Diagnostik çıktı oluşmadı."
            exit 1
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          # Birkaç uydu/diagnostik workflow'u aynı dakikada main'e veri yazabilir.
          # Eski sonucu zorlamak yerine güncel main üzerinde yeniden hesapla ve
          # push yarışı olursa sınırlı sayıda tekrar dene. Böylece normal bir
          # eşzamanlı veri commit'i kırmızı workflow üretmez; gerçekten
          # stabilize olamayan durum ise görünür failure olarak kalır.
          for attempt in 1 2 3 4; do
            echo "Analiz-kenarı güvenli kayıt denemesi ${attempt}/4"
            git fetch origin main

            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Ana dal denetim sırasında değişti; güncel raporda yeniden ölçülüyor."
              git reset --hard origin/main
              python active_edge_candidate_guard.py --self-test
              python active_edge_candidate_guard.py
            fi

            git add active_edge_candidate_review.json
            if git diff --cached --quiet; then
              echo "Güncel main üzerinde analiz-kenarı sonucu değişmedi; commit yok."
              exit 0
            fi

            git commit -m "Radar: aktif aday analiz kenarı sonucunu güncelle"
            if git push origin HEAD:main; then
              echo "Analiz-kenarı sonucu güncel main'e güvenle yazıldı."
              exit 0
            fi

            echo "Push sırasında main yeniden ilerledi; eski diagnostik zorlanmayacak."
          done

          echo "Ana dal dört denemede stabilize olmadı; diagnostik sonucu bayat yazmamak için hata ile çıkılıyor."
          exit 1