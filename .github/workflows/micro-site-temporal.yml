name: Mikro Şantiye Zaman Serisi Denetimi

on:
  push:
    branches: [main]
    paths:
      - "micro_site_temporal_guard.py"
      - "micro_site_shortlist.json"
      - "micro_site_audit.json"
      - ".github/workflows/micro-site-temporal.yml"
  schedule:
    # Ana Sentinel + mikro tarama + kısa liste tamamlandıktan sonra çalışır.
    - cron: "45 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-micro-temporal
  cancel-in-progress: false

jobs:
  temporal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Ana uydu kalite korumalarını doğrula
        run: python satellite_quality.py

      - name: Mikro zaman-serisi öz testini çalıştır
        run: python micro_site_temporal_guard.py --check-only

      - name: Üç Sentinel sahnesinde mikro adayları ölç
        run: python micro_site_temporal_guard.py

      - name: Diagnostik sonucu yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          if git ls-files --error-unmatch micro_site_temporal_review.json >/dev/null 2>&1; then
            meaningful="$(git diff -- micro_site_temporal_review.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
            if [[ -z "$meaningful" ]]; then
              echo "Yalnız çalışma zamanı değişti; gereksiz diagnostik commit yapılmıyor."
              git checkout -- micro_site_temporal_review.json
              exit 0
            fi
          fi

          if [[ -z "$(git status --porcelain -- micro_site_temporal_review.json)" ]]; then
            echo "Mikro temporal sonuç değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add micro_site_temporal_review.json
          git commit -m "Radar: mikro şantiye temporal incelemesini güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal değişti; eski diagnostik sonucu üzerine yazmadan sonraki çalışmaya bırakılıyor."
            exit 0
          fi
          git push origin HEAD:main
