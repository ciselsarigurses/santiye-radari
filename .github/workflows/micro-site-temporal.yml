name: Mikro Şantiye Zaman Serisi Denetimi

on:
  workflow_run:
    workflows: ["Mikro Şantiye Kısa Liste Filtresi"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "micro_site_temporal_guard.py"
      - "micro_site_orbit_guard.py"
      - "micro_site_locality_guard.py"
      - "micro_site_decision_guard.py"
      - "micro_site_field_review.json"
      - "micro_site_shortlist.json"
      - "micro_site_audit.json"
      - ".github/workflows/micro-site-temporal.yml"
  schedule:
    # workflow_run ana yol; takvim olası zincir kesintisine karşı emniyet ağıdır.
    - cron: "45 8,12,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-micro-temporal
  cancel-in-progress: false

jobs:
  temporal-review:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Ana uydu kalite korumalarını doğrula
        run: python satellite_quality.py

      - name: Mikro zaman-serisi öz testini çalıştır
        run: python micro_site_temporal_guard.py --check-only

      - name: Mikro yörünge geometrisi öz testini çalıştır
        run: python micro_site_orbit_guard.py --check-only

      - name: Mikro yerel-kontekst öz testini çalıştır
        run: python micro_site_locality_guard.py --check-only

      - name: Mikro kanıt birleştirme öz testini çalıştır
        run: python micro_site_decision_guard.py --check-only

      - name: Üç Sentinel sahnesinde mikro adayları ölç
        run: python micro_site_temporal_guard.py

      - name: Mikro ani başlangıç kanıtını yörünge geometrisiyle doğrula
        run: python micro_site_orbit_guard.py

      - name: Mikro adayın çevresel yaygınlığını ölç
        run: python micro_site_locality_guard.py

      - name: Mikro kanıtları tek diagnostik kararda birleştir
        run: python micro_site_decision_guard.py

      - name: Diagnostik sonuçları yalnız anlamlı değişiklikte kaydet
        shell: bash
        run: |
          if git ls-files --error-unmatch micro_site_temporal_review.json >/dev/null 2>&1; then
            meaningful_temporal="$(git diff -- micro_site_temporal_review.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "olusturma":)' || true)"
            if [[ -z "$meaningful_temporal" ]]; then
              echo "Temporal çıktıda yalnız çalışma zamanı değişti."
              git checkout -- micro_site_temporal_review.json
            fi
          fi

          if git ls-files --error-unmatch micro_site_locality_review.json >/dev/null 2>&1; then
            meaningful_locality="$(git diff -- micro_site_locality_review.json \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[-+]  "kaynak_temporal_olusturma":)' || true)"
            if [[ -z "$meaningful_locality" ]]; then
              echo "Lokalite çıktıda yalnız kaynak çalışma zamanı değişti."
              git checkout -- micro_site_locality_review.json
            fi
          fi

          if [[ -z "$(git status --porcelain -- micro_site_temporal_review.json micro_site_locality_review.json micro_site_decision_review.json)" ]]; then
            echo "Mikro diagnostik sonuçlar değişmedi."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"
          git add micro_site_temporal_review.json micro_site_locality_review.json micro_site_decision_review.json
          git commit -m "Radar: mikro kanıt sentezini güncelle"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "Ana dal değişti; eski diagnostik sonucu üzerine yazmadan sonraki çalışmaya bırakılıyor."
            exit 0
          fi
          git push origin HEAD:main
