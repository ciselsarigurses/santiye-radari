name: Kuru Zemin Zaman Serisi Denetimi

on:
  push:
    branches: [main]
    paths:
      - "dry_ground_temporal_audit.py"
      - "temporal_baseline_guard.py"
      - "temporal_orbit_guard.py"
      - "temporal_candidate_pool.py"
      - "temporal_locality_audit.py"
      - "coordinate_precision_audit.py"
      - ".github/workflows/dry-ground-temporal-audit.yml"
  workflow_run:
    workflows: ["Günlük Şantiye Taraması"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-dry-ground-temporal
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Geniş zaman serisi aday havuzu öz testi
        run: python temporal_candidate_pool.py --check-only

      - name: Zaman serisi aday havuzunu aynı Sentinel çiftinde genişlet
        run: python temporal_candidate_pool.py

      - name: Geniş aday havuzunu bu çalışma için güvenli uygula
        run: python temporal_candidate_pool.py --apply

      - name: Zaman serisi öz testi
        run: python dry_ground_temporal_audit.py --check-only

      - name: Kuru zemin adaylarının değişim öncesi kararlılığını ölç
        run: python dry_ground_temporal_audit.py

      - name: Uzun zaman serisi taban korumasını öz test et
        run: python temporal_baseline_guard.py --check-only

      - name: İkinci eski Sentinel aralığında tekrar eden zemin hareketini ele
        run: python temporal_baseline_guard.py

      - name: Göreli yörünge korumasını öz test et
        run: python temporal_orbit_guard.py --check-only

      - name: Üç Sentinel sahnesinin bakış geometrisini doğrula
        run: python temporal_orbit_guard.py

      - name: Küçük saha temporal yerellik öz testi
        run: python temporal_locality_audit.py --check-only

      - name: 250-900 m² adayın çevre halkasını ölç
        run: python temporal_locality_audit.py

      - name: Koordinat hassasiyetini öz test et
        run: python coordinate_precision_audit.py --check-only

      - name: Geometrik merkez ile sinyal-ağırlıklı Sentinel koordinatını karşılaştır
        run: python coordinate_precision_audit.py

      - name: Kanonik kuru zemin raporunu geri yükle
        run: git checkout -- dry_ground_gap_audit.json

      - name: Diagnostik raporu kaydet
        run: |
          report_files="dry_ground_temporal_pool.json dry_ground_temporal_audit.json temporal_locality_audit.json coordinate_precision_audit.json"

          regenerate_reports() {
            echo "Güncel main üzerinde temporal diagnostikler yeniden üretiliyor."
            python temporal_candidate_pool.py
            python temporal_candidate_pool.py --apply
            python dry_ground_temporal_audit.py
            python temporal_baseline_guard.py
            python temporal_orbit_guard.py
            python temporal_locality_audit.py
            python coordinate_precision_audit.py
            git checkout -- dry_ground_gap_audit.json
          }

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [[ -z "$(git status --porcelain -- $report_files)" ]]; then
              echo "Kuru zemin zaman serisi, yerellik ve koordinat hassasiyet raporu değişmedi."
              exit 0
            fi

            git add $report_files
            git commit -m "Radar: kuru zemin temporal yerellik ve koordinat raporunu güncelle"

            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Ana dal değişti; eski diagnostik rapor atılıyor ve güncel main üzerinde yeniden hesaplanıyor (${attempt}/3)."
              git reset --hard origin/main
              regenerate_reports
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push sırasında main ilerlemiş olabilir; güncel main üzerinde yeniden hesaplanıyor (${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            regenerate_reports
          done

          echo "Diagnostik rapor üç güvenli yeniden hesaplama denemesinde kaydedilemedi."
          exit 1
