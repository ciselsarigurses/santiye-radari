name: Post-Onset Çift Baseline Devamlılık Diagnostiği

on:
  push:
    branches: [main]
    paths:
      - "post_onset_dual_baseline_persistence_audit.py"
      - "post_onset_baseline_vegetation_guard_review.json"
      - ".github/workflows/post-onset-dual-baseline-persistence.yml"
  workflow_run:
    workflows:
      - "Baseline Bitki Negatif Bağlam Diagnostiği"
      - "Sentinel Yeni Sahne Hızlı Yoklama"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: santiye-radari-post-onset-dual-baseline-persistence
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Öz testi çalıştır
        run: python post_onset_dual_baseline_persistence_audit.py --check-only

      - name: 13→post ve 15→post devamlılığını ölç
        run: python post_onset_dual_baseline_persistence_audit.py

      - name: Diagnostiği güvenli kaydet
        run: |
          output="post_onset_dual_baseline_persistence_review.json"
          if [[ -z "$(git status --porcelain -- $output)" ]]; then
            echo "Çift-baseline diagnostiğinde semantik değişiklik yok."
            exit 0
          fi

          git config user.name "santiye-radari-bot"
          git config user.email "santiye-radari-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python post_onset_dual_baseline_persistence_audit.py --check-only
            python post_onset_dual_baseline_persistence_audit.py

            if [[ -z "$(git status --porcelain -- $output)" ]]; then
              echo "Güncel main üzerinde kayıt gerektiren fark kalmadı."
              exit 0
            fi

            git add "$output"
            git commit -m "Radar: çift S2 baseline devamlılık diagnostiğini güncelle"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Ana dal ilerledi; yeniden denenecek (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Çift-baseline diagnostik kaydı tamamlanamadı."
          exit 1
